aid: namirial

name: Namirial

description: Namirial is a European digital trust services company and qualified trust service provider. Its own site describes products for customer
  identification and identity verification (Namirial Onboarding), electronic signatures, digital identity wallets (Wallet Gateway, Wallet App),
  and related trust and compliance services for large enterprises, SMEs and public administration. It publishes product documentation, developer
  SDK docs (Android, iOS, Windows) and a Connectors APIs reference.

