    EnvelopeBulkSendExpirationConfiguration:
      description: The configuration of the expiration for the envelope.
      type: object
      properties:
        ExpirationInSecondsAfterSending:
          description: 'The relative expiration in seconds after sending the envelope.

            Must be a positive number between 600 and the maximum envelope validity located in the system configuration [Configuration key: maxEnvelopeValidityInDays, Default: 2419200 seconds (28 days)].

            Must not be defined when property <code>ExpirationDate</code> is specified.'
          type: integer
        ExpirationDate:
          format: date-time
          description: 'The absolute expiration date of the envelope.

            Must not be in the past.

            Must not be defined when property <code>ExpirationInSecondsAfterSending</code> is specified.

            A datetime in the format RFC 3339, section 5.6, ''date-Time'' (e.g. 2017-07-21T17:32:28Z).'
          maxLength: 30
          minLength: 20
          type: string
    EnvelopeBulkSendSignaturePluginParameter:
      description: The definition of a signature plugin parameter.
      type: object
      properties:
        Key:
          description: The identifier of the parameter.
          maxLength: 500
          minLength: 0
          type: string
        Value:
          description: The value of the parameter.
          maxLength: 500
          minLength: 0
          type: string
    EnvelopeBulkSendSignBulk:
      description: A sign action for multiple recipients.
      required:
      - BulkRecipients
      type: object
      properties:
        BulkRecipients:
          description: The recipients that are part of the bulk.
          maxItems: 1000
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeBulkSendRecipient'
        SequenceMode:
          description: The sequence mode.
          enum:
          - NoSequenceEnforced
          - SequenceEnforced
          type: string
        Elements:
          $ref: '#/components/schemas/EnvelopeBulkSendElements'
          description: The elements in the document (e.g. form fields) assigned to the recipient.
        FinishActionConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendFinishAction'
          description: Defines what happens in the signing clients, after an action has been finished.
        BatchConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendBatchConfiguration'
          description: The configuration of a signing batch.
        GeneralPoliciesOverrides:
          $ref: '#/components/schemas/EnvelopeBulkSendGeneralPoliciesForSignAction'
          description: Viewer policy settings for override.
    EnvelopeBulkSendRadioButtonGroupDefinition:
      description: The configuration of the radio button group definition.
      type: object
      properties:
        IsSelectUnison:
          description: If true, radiobuttons with the same <code>ExportValue</code> are checked and unchecked together.
          type: boolean
        Items:
          description: The list of radio buttons that belong to the same group.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeBulkSendRadioButtonItemDefinition'
    EnvelopeBulkSendSignAsP7M:
      description: An action to sign the documents with P7M.
      required:
      - RecipientConfiguration
      - SignatureMethods
      type: object
      properties:
        RecipientConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendAdvancedRecipientConfiguration'
          description: The configuration of the recipient.
        SignatureMethods:
          $ref: '#/components/schemas/EnvelopeBulkSendP7MSignatureMethods'
          description: The configuration of recipient data for P7M signatures.
        GeneralPoliciesOverrides:
          $ref: '#/components/schemas/EnvelopeBulkSendGeneralPoliciesForP7MAction'
          description: Viewer policy settings for override.
    EnvelopeBulkSendTextFormat:
      description: The configuration of the text format.
      required:
      - FontSizeInPt
      - FontName
      type: object
      properties:
        TextColor:
          description: 'The color of the text. The default color is black.

            Six digit hexadecimal color that starts with # in #RRGGBB format according to CSS Color Module Level 4, paragraph 5.2.'
          maxLength: 7
          minLength: 7
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: number
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        Bold:
          description: If true, the bold font is used.
          type: boolean
        Italic:
          description: If true, the italic font is used.
          type: boolean
        TextAlign:
          description: The alignment of the text. The default alignment is left.
          enum:
          - Left
          - Center
          - Right
          type: string
    EnvelopeBulkSendEmailAppLinks:
      description: Configure if links for our apps should be included in the recipient document signing request email message.
      type: object
      properties:
        Android:
          description: If true, an Android app link is added to the email message.
          type: boolean
        iOS:
          description: If true, an iOS app link is added to the email message.
          type: boolean
        Windows:
          description: If true, a Windows app link is added to the email message.
          type: boolean
    EnvelopeBulkSendPhoneValidationConfiguration:
      description: The validation rules for phone numbers.
      type: object
      properties:
        Type:
          description: The format of the phone numbers.
          enum:
          - International
          - InternationalLeadingZeros
          - InternationalLeadingPlus
          type: string
    EnvelopeBulkSendInitials:
      description: The configuration of the predefined element showing the initials.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        IncludeMiddleNameInitials:
          description: "If true, the initials from the middle names are included as well. \nThe initials are read from the given name. Additional names are expected to be separated by a space."
          type: boolean
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeBulkSendPredefinedElementDefinition'
          description: 'The definition of the predefined element.

            It must be specified when the predefined element is added.

            It must not be specified when the predefined element already exists.'
    EnvelopeBulkSendActivityActionCallbackConfiguration:
      description: The configuration of the callback for workstep events.
      required:
      - Url
      type: object
      properties:
        Url:
          description: The callback URL triggered for the selected events.
          maxLength: 8000
          minLength: 0
          type: string
        ActionCallbackSelection:
          $ref: '#/components/schemas/EnvelopeBulkSendActionCallbackSelection'
          description: The selection of events which trigger the callback.
    EnvelopeBulkSendReadPagesConfirmation:
      description: The page which has to be read.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        DisplayName:
          description: The displayed name.
          maxLength: 500
          minLength: 0
          type: string
        PageNumber:
          format: int32
          description: The number of the page that needs to be read. Starting with 1.
          type: integer
        GuidingOrder:
          description: The order of the element.
          type: integer
    EnvelopeBulkGetResponse:
      description: The response model for requesting the bulk envelope overview.
      type: object
      properties:
        BulkStatus:
          description: The status of the BulkParent envelope.
          enum:
          - Active
          - PartlyCompleted
          - Completed
          type: string
          x-ms-enum:
            name: BulkStatus
            modelAsString: false
        Children:
          description: The children of the bulk envelope.
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeBulkGetChildEnvelope'
    EnvelopeBulkSendOneTimePasswordSignatureType:
      description: The configuration of the OneTimePassword signature.
      type: object
      properties:
        ValidityInSeconds:
          description: The validity of the password in seconds.
          type: integer
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendOneTimePasswordStampImprint'
          description: The configuration of the stamp imprint of the signature.
    EnvelopeBulkSendDisposableCertificateStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeBulkSendUnassignedElements:
