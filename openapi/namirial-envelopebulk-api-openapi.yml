          $ref: '#/components/schemas/EnvelopeBulkSendRecipientConfiguration'
          description: The configuration of the recipient.
        GeneralPoliciesOverrides:
          $ref: '#/components/schemas/EnvelopeBulkSendGeneralPoliciesForViewAction'
          description: Viewer policy settings for override.
    EnvelopeBulkSendSwissComOnDemandStampImprint:
