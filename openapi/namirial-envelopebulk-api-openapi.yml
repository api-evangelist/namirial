          - Email
          - Sms
          - WhatsApp
          type: string
        AllowAccessAfterFinish:
          description: 'If true, the recipient is allowed to access the action after it has been finished.

            It is required that the organization has the AllowAccessFinishedWorkstep feature enabled.

            The default value is taken from the OrganizationSettings.'
          type: boolean
