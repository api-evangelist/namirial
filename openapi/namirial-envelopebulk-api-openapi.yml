      description: The validation rules for numbers.
      type: object
      properties:
        DecimalDigits:
          description: The expected amount of decimal digits.
          type: integer
        Symbol:
          description: The expected symbol.
          maxLength: 5
          minLength: 0
          type: string
        SymbolLocation:
          description: The defined symbol location.
          enum:
          - Start
          - StartWithBlank
          - End
          - EndWithBlank
          type: string
        GroupSeparator:
          description: The expected thousands separator.
          enum:
          - Comma
          - Point
          - Apostrophe
          - Blank
          - None
          type: string
        DecimalSeparator:
          description: The expected decimal separator.
          enum:
          - Comma
          - Point
          - Apostrophe
          - None
          type: string
          x-ms-enum:
            name: DecimalSeparatorType
            modelAsString: false
        Range:
          $ref: '#/components/schemas/EnvelopeBulkSendFieldValidationRange'
          description: The range of the values.
    EnvelopeBulkFindRequest:
      description: "The request model for searching BulkParent envelopes.\nWe are searching for BulkChild but return only BulkParent information. \nNote: At this stage, there is no possibility to filter for specific status values."
      type: object
      properties:
        SenderEmail:
          description: If set, envelopes sent by the user with the given email address are matched.
          maxLength: 250
          minLength: 0
          type: string
        CompletedByRecipientWithEmail:
          description: If set, envelopes containing a completed activity, belonging to a recipient with the given email address, are matched.
          maxLength: 250
          minLength: 0
          type: string
        WaitingForRecipientWithEmail:
          description: If set, envelopes waiting for the recipient with the given email address are matched.
          maxLength: 250
          minLength: 0
          type: string
        EnvelopeBulkChildId:
          description: If set, it matches only the BulkParent which contains a child envelope with the given identifier.
          maxLength: 36
          minLength: 36
          type: string
        StartDate:
          format: date-time
          description: 'If set, filter for envelopes which were sent after the start date.

            A datetime in the format RFC 3339, section 5.6, ''date-Time'' (e.g. 2017-07-21T17:32:28Z).'
          maxLength: 30
          minLength: 20
          type: string
        EndDate:
