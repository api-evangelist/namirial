    EnvelopeBulkSendTextBox:
      description: The configuration of the text box.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        Value:
          description: The value of the text box.
          maxLength: 204800
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        GuidingOrder:
          description: The order of the element.
          type: integer
        Validation:
          $ref: '#/components/schemas/EnvelopeBulkSendFieldValidation'
          description: The configuration of the validation rules for the text box value.
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeBulkSendTextBoxDefinition'
          description: 'The definition of the text box.

            It must be specified when the check box is added.

            It must not be specified when the check box already exists.'
    EnvelopeBulkSendDocument:
      description: Define a document.
      type: object
      properties:
        FileId:
          description: The identifier of the file.
          maxLength: 36
          minLength: 36
          type: string
        DocumentNumber:
          format: int32
          description: 'The document number.

            If the document number is 0 for all documents, the order of the documents is used as number.

            The document number must not be duplicated.

            The document number must be set for all documents or none.'
          type: integer
    EnvelopeBulkSendRemoteCertificateSignatureType:
      description: The configuration of the RemoteCertificate signature.
      type: object
      properties:
        ValidityInSeconds:
          description: The validity of the certificate in seconds.
          type: integer
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendRemoteCertificateStampImprint'
          description: The configuration of the stamp imprint of the signature.
    EnvelopeBulkSendSwedishBankIdSignatureData:
      description: The recipient configuration for signing with Swedish BankID.
      type: object
      properties:
        PersonalNumber:
          description: The personal number for signing.
          maxLength: 500
          minLength: 0
          type: string
        AllowAnyPersonalNumber:
          description: 'If true, the personal number can be edited by the recipient.

            If the personal number is empty and can be edited, a QR code for scanning is provided.'
          type: boolean
    EnvelopeBulkSendSwissComOnDemandSignatureType:
      description: The configuration of the Swisscom On-Demand signature.
      type: object
      properties:
        ValidityInSeconds:
          description: The validity of the certificate in seconds.
          type: integer
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendSwissComOnDemandStampImprint'
          description: The configuration of the stamp imprint of the signature.
    ErrorResponse:
      description: Error object that is returned when the api call was not processed successfully.
      type: object
      properties:
        ErrorId:
          description: Id of the error.
          type: string
        Message:
          description: Message from the error.
          type: string
        TraceId:
          description: Trace identifier.
          type: string
    EnvelopeBulkSendGeneralPoliciesForSignAction:
      description: Define the general policies allowed for sign action.
      type: object
      properties:
        AllowSaveDocument:
          description: If true, the client is allowed to save the workstep document.
          type: boolean
        AllowSaveAuditTrail:
          description: If true, the client is allowed to save the audittrail document.
          type: boolean
        AllowPrintDocument:
          description: If true, the client is allowed to print the workstep document.
          type: boolean
        AllowAdhocPdfAttachments:
          description: If true, the client is allowed to append adhoc documents.
          type: boolean
        AllowRejectWorkstep:
          description: If true, the client is allowed to reject the workstep.
          type: boolean
        AllowUndoLastAction:
          description: If true, the client is allowed to undo actions.
          type: boolean
    EnvelopeBulkSendPredefinedText:
      description: The configuration of the element showing the predefined text.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Value:
          description: The value of the predefined text.
          maxLength: 1000
          minLength: 0
          type: string
