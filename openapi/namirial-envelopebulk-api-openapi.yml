          $ref: '#/components/schemas/EnvelopeBulkSendATrustCertificateSignatureData'
          description: The A-Trust certificate configuration for the action.
        SwedishBankId:
          $ref: '#/components/schemas/EnvelopeBulkSendSwedishBankIdSignatureData'
