    EnvelopeBulkSendRecipientConfiguration:
      description: The configuration of the recipient.
      type: object
      properties:
        ContactInformation:
          $ref: '#/components/schemas/EnvelopeBulkSendContactInformation'
          description: The contact information of the recipient.
        PersonalMessage:
          description: The personal message for the recipient.
          maxLength: 204800
          minLength: 0
          type: string
        AuthenticationConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendAuthenticationConfiguration'
          description: The configuration for the authentication of the recipient.
        SendEmails:
          description: 'Obsolete: If true, emails will be sent out for this recipient.

            Use NotificationChannel property instead, which also allows sending with other notification channels than Email.

            NotificationChannel.None is the equivalent of sending false.

            NotificationChannel.Email is the equivalent of sending true.

            If the NotificationChannel property is used/sent this property will be ignored.'
          type: boolean
        NotificationChannel:
          description: 'Which channel is used for sending notifications to the recipient.

            Default Email if not specified.'
          enum:
