openapi: 3.2.0
info:
  title: Namirial Envelope Bulk API
  version: v6
  description: 'Operations tagged EnvelopeBulk across 2 of this provider''s published API definitions: namirial-esignanywhere-v6-swagger.json, namirial-esignanywhere-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
- url: https://saas.esignanywhere.net/api
tags:
- name: EnvelopeBulk
paths:
  /v6/envelopebulk/{bulkId}:
    get:
      tags:
      - EnvelopeBulk
      summary: Get an overview of an envelope bulk and its children
      operationId: EnvelopeBulk_Get
      parameters:
      - name: bulkId
        in: path
        description: The identifier of the envelope bulk.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBulkGetResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBulkGetResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/envelopebulk/find:
    post:
      tags:
      - EnvelopeBulk
      summary: Get basic information about envelope bulks which match your filter criteria
      operationId: EnvelopeBulk_Find
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBulkFindResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBulkFindResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkFindRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkFindRequest'
        description: The filter criteria.
        required: true
    servers:
    - url: /api
  /v6/envelopebulk/send:
    post:
      tags:
      - EnvelopeBulk
      summary: Create and send an envelope bulk
      operationId: EnvelopeBulk_Send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBulkSendResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBulkSendResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkSendRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkSendRequest'
        description: The definition of the envelope bulk.
        required: true
    servers:
    - url: /api
  /v6/envelopebulk/cancel:
    post:
      tags:
      - EnvelopeBulk
      summary: Cancel all active BulkChild envelopes
      operationId: EnvelopeBulk_Cancel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Void'
            text/json:
              schema:
                $ref: '#/components/schemas/Void'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkCancelRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkCancelRequest'
        description: The model containing the cancel options.
        required: true
    servers:
    - url: /api
  /v6/envelopebulk/delete:
    post:
      tags:
      - EnvelopeBulk
      summary: Delete an envelope bulk and its children
      operationId: EnvelopeBulk_Delete
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Void'
            text/json:
              schema:
                $ref: '#/components/schemas/Void'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkDeleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkDeleteRequest'
        description: The model containing the delete options.
        required: true
    servers:
    - url: /api
  /v6/envelopebulk/remind:
    post:
      tags:
      - EnvelopeBulk
      summary: Send a reminder to active activities of all BulkChild envelopes
      operationId: EnvelopeBulk_Remind
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBulkRemindResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBulkRemindResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkRemindRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkRemindRequest'
        description: The model containing the remind options.
        required: true
    servers:
    - url: /api
  /v6/envelopebulk/restartexpired:
    post:
      tags:
      - EnvelopeBulk
      summary: Restart all expired BulkChild envelopes
      operationId: EnvelopeBulk_RestartExpired
      responses:
        '200':
          description: OK
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkRestartExpiredRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/EnvelopeBulkRestartExpiredRequest'
        description: The model containing the restart options.
        required: true
    servers:
    - url: /api
components:
  schemas:
    EnvelopeBulkRestartExpiredRequest:
      description: The request model for restarting all expired BulkChild envelopes.
      required:
      - EnvelopeBulkId
      type: object
      properties:
        EnvelopeBulkId:
          description: The identifier of the BulkParent envelope.
          maxLength: 36
          minLength: 36
          type: string
        ExpirationInSecondsAfterSending:
          description: 'The relative expiration in seconds after sending the envelope.

            Must be a positive number between 600 and the maximum envelope validity located in the system configuration [Configuration key: maxEnvelopeValidityInDays, Default: 2419200 seconds (28 days)].

            Must not be defined when property <code>ExpirationDate</code> is specified.'
          type: integer
        ExpirationDate:
          format: date-time
          description: 'The absolute expiration date of the envelope.

            Must not be in the past.

            Must not be defined when property <code>ExpirationInSecondsAfterSending</code> is specified.

            A datetime in the format RFC 3339, section 5.6, ''date-Time'' (e.g. 2017-07-21T17:32:28Z).'
          maxLength: 30
          minLength: 20
          type: string
    EnvelopeBulkSendListBoxDefinition:
      description: The configuration of the combo box.
      required:
      - Items
      - Position
      - Size
      type: object
      properties:
        TextFormat:
          $ref: '#/components/schemas/EnvelopeBulkSendTextFormat'
          description: The configuration of the text format.
        Items:
          description: A list of items that can be selected for the element.
          maxItems: 50
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeBulkSendChoiceItem'
        IsMultiSelect:
          description: If true, multiple values of the list box can be selected.
          type: boolean
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
        Position:
          $ref: '#/components/schemas/EnvelopeBulkSendPosition'
          description: The position of the element within the document.
        Size:
          $ref: '#/components/schemas/EnvelopeBulkSendSize'
          description: The size of the element.
    EnvelopeBulkSendResponse:
      description: The response model after sending a bulk envelope successfully.
      type: object
      properties:
        EnvelopeBulkChildren:
          description: The information about the created BulkChild envelopes.
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeBulkSendChild'
        EnvelopeBulkParentId:
          description: The identifier of the BulkParent envelope.
          type: string
    EnvelopeBulkSendAccessCodeAuthentication:
      description: The configuration for authentication with a predefined access code.
      type: object
      properties:
        Code:
          description: The code for authenticating the recipient.
          maxLength: 500
          minLength: 0
          type: string
    EnvelopeBulkSendPluginStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayEmail:
          description: If true, the email address of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeBulkFindParentEnvelope:
      description: The response model for found envelopes.
      type: object
      properties:
        Id:
          description: The identifier of the envelope.
          type: string
        Name:
          description: The name of the envelope.
          type: string
        MetaData:
          description: The metadata of the envelope.
          type: string
    EnvelopeBulkSendTypeToSignSignatureType:
      description: The configuration of the signature image.
      type: object
      properties:
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendTypeToSignStampImprint'
          description: The configuration of the stamp imprint of the signature.
    EnvelopeBulkSendStampImprintDateConfiguration:
      description: The configuration of the stamp imprint date.
      type: object
      properties:
        UseLocalTimezone:
          description: If true, the local timezone is used.
          type: boolean
        DateTimeFormat:
          description: The format of the timestamp.
          maxLength: 50
          minLength: 0
          type: string
    EnvelopeBulkSendVisibleSignature:
      description: A signature with a visual appearance on the document.
      required:
      - FieldDefinition
      type: object
      properties:
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        UseExternalTimestampServer:
          description: If true, a timestamp from an external server is embedded into the signature.
          type: boolean
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeBulkSendSignatureFieldDefinition'
          description: 'The definition of the signature field.

            It must be specified when the signature field is added.

            It must not be specified when the signature field already exists.'
    EnvelopeBulkSendRadioButtonGroup:
      description: The configuration of the radio button group.
      type: object
      properties:
        GroupName:
          description: The name of the radio button group.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Required:
          description: If true, the element is required.
          type: boolean
        SelectedItem:
          description: The export value of the selected item of the radio button group.
          maxLength: 500
          minLength: 0
          type: string
        GuidingOrder:
          description: The order of the element.
          type: integer
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeBulkSendRadioButtonGroupDefinition'
          description: 'The definition of the radio button group.

            It must be specified when the radio button group is added.

            It must not be specified when the radio button group already exists.'
    EnvelopeBulkSendSmsOneTimePasswordAuthentication:
      description: The configuration for authentication with a one time password sent over SMS.
      type: object
      properties:
        PhoneNumber:
          description: The phone number to which the one time password will be sent.
          maxLength: 250
          minLength: 0
          pattern: ^(\+|00){1}\(?([0-9]{2,})\)?([\-. ]?([0-9]{2,})){1,}$
          type: string
    EnvelopeBulkSendReadDocumentConfirmation:
      description: The document which has to be read.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        DisplayName:
          description: The displayed name.
          maxLength: 500
          minLength: 0
          type: string
        GuidingOrder:
          description: The order of the element.
          type: integer
    EnvelopeBulkSendSurname:
      description: The configuration of the predefined element.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeBulkSendPredefinedElementDefinition'
          description: 'The definition of the predefined element.

            It must be specified when the predefined element is added.

            It must not be specified when the predefined element already exists.'
    EnvelopeBulkSendLinkDefinition:
      description: The settings of a positionable element.
      required:
      - Position
      - Size
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/EnvelopeBulkSendPosition'
          description: The position of the element within the document.
        Size:
          $ref: '#/components/schemas/EnvelopeBulkSendSize'
          description: The size of the element.
    EnvelopeBulkSendAdvancedRecipientConfiguration:
      description: The advanced configuration for the recipient.
      type: object
      properties:
        ContactInformation:
          $ref: '#/components/schemas/EnvelopeBulkSendContactInformation'
          description: The contact information of the recipient.
        PersonalMessage:
          description: The personal message for the recipient.
          maxLength: 204800
          minLength: 0
          type: string
        AuthenticationConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendAuthenticationConfiguration'
          description: The configuration for the authentication of the recipient.
        SendEmails:
          description: 'Obsolete: If true, emails will be sent out for this recipient.

            Use NotificationChannel property instead, which also allows sending with other notification channels than Email.

            NotificationChannel.None is the equivalent of sending false.

            NotificationChannel.Email is the equivalent of sending true.

            If the NotificationChannel property is used/sent this property will be ignored.'
          type: boolean
        NotificationChannel:
          description: 'Which channel is used for sending notifications to the recipient.

            Default Email if not specified.'
          enum:
          - None
          - Email
          - Sms
          - WhatsApp
          type: string
        AllowAccessAfterFinish:
          description: 'If true, the recipient is allowed to access the action after it has been finished.

            It is required that the organization has the AllowAccessFinishedWorkstep feature enabled.

            The default value is taken from the OrganizationSettings.'
          type: boolean
        IncludedEmailAppLinks:
          $ref: '#/components/schemas/EnvelopeBulkSendEmailAppLinks'
          description: The configuration for mobile app links in email messages.
        AllowDelegation:
          description: If true, the recipient may delegate this activity to another person.
          type: boolean
        RequireViewContentBeforeFormFilling:
          description: If true, the signer has to confirm the reading of all documents as first task.
          type: boolean
    EnvelopeBulkSendSignatureTaskConfiguration:
      description: The configuration of the signature task.
      type: object
      properties:
        StampImprintDateConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendStampImprintDateConfiguration'
          description: The configuration of the stamp imprint date.
        BatchGroup:
          description: The batch group.
          maxLength: 500
          minLength: 0
          type: string
    EnvelopeBulkSendSignatureField:
      description: The configuration of the signature field.
      required:
      - ElementId
      - AllowedSignatureTypes
      type: object
      properties:
        ElementId:
          description: The identifier of the signature.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        DisplayName:
          description: The displayed name.
          maxLength: 500
          minLength: 0
          type: string
        FieldDescription:
          description: The description of the signature.
          maxLength: 500
          minLength: 0
          type: string
        UseExternalTimestampServer:
          description: If true, a timestamp from an external server is embedded into the signature.
          type: boolean
        GuidingOrder:
          description: The order of the element.
          type: integer
        AllowedSignatureTypes:
          $ref: '#/components/schemas/EnvelopeBulkSendAllowedSignatureTypes'
          description: The allowed types for the signature.
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeBulkSendSignatureFieldDefinition'
          description: 'The definition of the signature field.

            It must be specified when the signature field is added.

            It must not be specified when the signature field already exists.'
        TaskConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendSignatureTaskConfiguration'
          description: The configuration of the task.
    EnvelopeBulkSendOneTimePasswordStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayTransactionId:
          description: If true, the transaction identifier is displayed.
          type: boolean
        DisplayTransactionToken:
          description: If true, the transaction token is displayed.
          type: boolean
        DisplayPhoneNumber:
          description: If true, the phone number of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeBulkSendCallbackConfiguration:
      description: The configuration of the callbacks for a custom integration.
      type: object
      properties:
        CallbackUrl:
          description: The callback URL triggered when the envelope has been finished.
          maxLength: 8000
          minLength: 0
          type: string
        StatusUpdateCallbackUrl:
          description: The callback URL triggered for status updates of an envelope.
          maxLength: 8000
          minLength: 0
          type: string
        ActivityActionCallbackConfiguration:
          $ref: '#/components/schemas/EnvelopeBulkSendActivityActionCallbackConfiguration'
          description: The configuration of the callback for workstep events.
    EnvelopeBulkSendReminderConfiguration:
      description: The configuration for reminders.
      type: object
      properties:
        Enabled:
          description: If true, reminders are sent.
          type: boolean
        FirstReminderInDays:
          description: The amount of days until a reminder is sent to a signer or a viewer after the initial notification.
          type: integer
        ReminderResendIntervalInDays:
          description: The amount of days until a reminder is sent again to a signer or a viewer.
          type: integer
        BeforeExpirationInDays:
          description: The amount of days before the envelope expires and a reminder should be sent.
          type: integer
    EnvelopeBulkSendRadioButtonItemDefinition:
      description: The configuration of the radio button.
      required:
      - Position
      - Size
      type: object
      properties:
        ExportValue:
          description: The value of the element when the radio button is checked.
          maxLength: 500
          minLength: 0
          type: string
        IsChecked:
          description: If true, the radio button is checked by default.
          type: boolean
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
        Position:
          $ref: '#/components/schemas/EnvelopeBulkSendPosition'
          description: The position of the element within the document.
        Size:
          $ref: '#/components/schemas/EnvelopeBulkSendSize'
          description: The size of the element.
    EnvelopeBulkSendPosition:
      description: The position of an element on the document.
      required:
      - X
      - Y
      type: object
      properties:
        PageNumber:
          format: int32
          description: The number of the page where the element is located. It starts with 1.
          type: integer
        X:
          format: double
          description: The X coordinate in points. It starts from the left.
          type: number
        Y:
          format: double
          description: The Y coordinate in points. It starts from the bottom.
          type: number
    EnvelopeBulkSendSignaturePluginSignatureData:
      description: The recipient configuration for signing with a signature plugin.
      type: object
      properties:
        PluginId:
          description: The identifier of the signature plugin.
          maxLength: 500
          minLength: 0
          type: string
        Fields:
          description: The plugin parameters referred to as the GSP sender data fields.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeBulkSendSignaturePluginParameter'
    EnvelopeBulkSendClickToSignSignatureType:
      description: The configuration of the signature image.
      type: object
      properties:
        UseExternalSignatureImage:
