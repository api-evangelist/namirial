openapi: 3.2.0
info:
  title: Namirial Envelope Activity API
  version: v6
  description: 'Operations tagged EnvelopeActivity across 2 of this provider''s published API definitions: namirial-esignanywhere-v6-swagger.json, namirial-esignanywhere-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
- url: https://saas.esignanywhere.net/api
tags:
- name: EnvelopeActivity
paths:
  /v6/envelope/activity/delete:
    post:
      tags:
      - EnvelopeActivity
      summary: Delete an unfinished activity of an active envelope
      operationId: EnvelopeActivity_Delete
      responses:
        '200':
          description: OK
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeActivityDeleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/EnvelopeActivityDeleteRequest'
        description: The model containing the delete options.
        required: true
    servers:
    - url: /api
  /v6/envelope/activity/replace:
    post:
      tags:
      - EnvelopeActivity
      summary: Replace an unfinished activity of an active envelope with a new one
      operationId: EnvelopeActivity_Replace
      responses:
        '200':
          description: OK
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeActivityReplaceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/EnvelopeActivityReplaceRequest'
        description: The definition of the new activity.
        required: true
    servers:
    - url: /api
components:
  schemas:
    EnvelopeActivityReplaceDisposableCertificateSignatureType:
      description: The configuration of the DisposableCertificate signature.
      type: object
      properties:
        IsLongLived:
          description: If true, the disposable certificate is long lived.
          type: boolean
        ValidityInSeconds:
          description: The validity of the certificate in seconds.
          type: integer
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceDisposableCertificateStampImprint'
          description: The configuration of the stamp imprint of the signature.
    EnvelopeActivityDeleteRequest:
      description: The request model for deleting an activity.
      required:
      - ActivityId
      type: object
      properties:
        ActivityId:
          description: The identifier of the activity.
          maxLength: 36
          minLength: 36
          type: string
    EnvelopeActivityReplaceCheckBox:
      description: The configuration of the check box.
      required:
      - ElementId
      - DocumentNumber
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        IsChecked:
          description: If true, the check box is checked.
          type: boolean
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        GuidingOrder:
          description: The order of the element.
          type: integer
    EnvelopeActivityReplaceClickToSignStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayEmail:
          description: If true, the email address of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeActivityReplaceFullName:
      description: The configuration of the predefined element.
      required:
      - DocumentNumber
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeActivityReplacePredefinedElementDefinition'
          description: 'The definition of the predefined element.

            It must be specified when the predefined element is added.

            It must not be specified when the predefined element already exists.'
    EnvelopeActivityReplaceSignAsP7M:
      description: An action to sign the documents with P7M.
      type: object
      properties:
        RecipientConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceAdvancedRecipientConfiguration'
          description: The configuration of the recipient.
        SignatureMethods:
          $ref: '#/components/schemas/EnvelopeActivityReplaceP7MSignatureMethods'
          description: The configuration of recipient data for P7M signatures.
        GeneralPoliciesOverrides:
          $ref: '#/components/schemas/EnvelopeActivityReplaceGeneralPoliciesForP7MAction'
          description: Viewer policy settings for override.
    EnvelopeActivityReplaceOneTimePasswordSignatureType:
      description: The configuration of the OneTimePassword signature.
      type: object
      properties:
        ValidityInSeconds:
          description: The validity of the password in seconds.
          type: integer
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceOneTimePasswordStampImprint'
          description: The configuration of the stamp imprint of the signature.
    EnvelopeActivityReplaceElements:
      description: The elements of the documents which are assigned to the activity.
      type: object
      properties:
        TextBoxes:
          description: The text boxes.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceTextBox'
        CheckBoxes:
          description: The check boxes.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceCheckBox'
        ComboBoxes:
          description: The combo boxes.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceComboBox'
        RadioButtons:
          description: The radio buttons.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceRadioButtonGroup'
        ListBoxes:
          description: The list boxes.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceListBox'
        Signatures:
          description: The signatures.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceSignatureField'
        Attachments:
          description: The attachments.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceAttachment'
        PredefinedFieldElements:
          $ref: '#/components/schemas/EnvelopeActivityReplacePredefinedFieldElements'
          description: The predefined field elements.
        LinkConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceLinkConfiguration'
          description: The links in the documents.
        AreaReadConfirmations:
          description: The areas which have to be read.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceReadAreaConfirmation'
        PageReadConfirmations:
          description: The pages which have to be read.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceReadPagesConfirmation'
        DocumentReadConfirmations:
          description: The documents which have to be read.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceReadDocumentConfirmation'
    EnvelopeActivityReplaceVisibleSignature:
      description: A signature with a visual appearance on the document.
      required:
      - DocumentNumber
      type: object
      properties:
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        UseExternalTimestampServer:
          description: If true, a timestamp from an external server is embedded into the signature.
          type: boolean
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeActivityReplaceSignatureFieldDefinition'
          description: 'The definition of the signature field.

            It must be specified when the signature field is added.

            It must not be specified when the signature field already exists.'
    EnvelopeActivityReplaceRequest:
      description: Define an activity in the process.
      required:
      - ActivityId
      type: object
      properties:
        ActivityId:
          description: The identifier of the activity.
          maxLength: 36
          minLength: 36
          type: string
        Action:
          $ref: '#/components/schemas/EnvelopeActivityReplaceAction'
          description: The action assigned to the activity.
        VisibilityOptions:
          description: The document visibility options for the activity.
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceVisibilityOption'
    EnvelopeActivityReplaceSwedishBankIdStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayTransactionId:
          description: If true, the transaction identifier is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeActivityReplaceSwissComOnDemandStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeActivityReplaceTextBox:
      description: The configuration of the text box.
      required:
      - ElementId
      - DocumentNumber
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        Value:
          description: The value of the text box.
          maxLength: 204800
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        GuidingOrder:
          description: The order of the element.
          type: integer
        Validation:
          $ref: '#/components/schemas/EnvelopeActivityReplaceFieldValidation'
          description: The configuration of the validation rules for the text box value.
    EnvelopeActivityReplacePosition:
      description: The position of an element on the document.
      required:
      - X
      - Y
      type: object
      properties:
        PageNumber:
          format: int32
          description: The number of the page where the element is located. It starts with 1.
          type: integer
        X:
          format: double
          description: The X coordinate in points. It starts from the left.
          type: number
        Y:
          format: double
          description: The Y coordinate in points. It starts from the bottom.
          type: number
    EnvelopeActivityReplaceOneTimePasswordStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayTransactionId:
          description: If true, the transaction identifier is displayed.
          type: boolean
        DisplayTransactionToken:
          description: If true, the transaction token is displayed.
          type: boolean
        DisplayPhoneNumber:
          description: If true, the phone number of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeActivityReplaceDateValidationConfiguration:
      description: The validation rules for dates.
      type: object
      properties:
        DateFormat:
          description: The format of the dates.
          maxLength: 50
          minLength: 0
          type: string
        Range:
          $ref: '#/components/schemas/EnvelopeActivityReplaceFieldValidationRange'
          description: The range of the values.
    EnvelopeActivityReplaceAdvancedRecipientConfiguration:
      description: The advanced configuration for the recipient.
      type: object
      properties:
        ContactInformation:
          $ref: '#/components/schemas/EnvelopeActivityReplaceContactInformation'
          description: The contact information of the recipient.
        PersonalMessage:
          description: The personal message for the recipient.
          maxLength: 204800
          minLength: 0
          type: string
        AuthenticationConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceAuthenticationConfiguration'
          description: The configuration for the authentication of the recipient.
        SendEmails:
          description: 'Obsolete: If true, emails will be sent out for this recipient.

            Use NotificationChannel property instead, which also allows sending with other notification channels than Email.

            NotificationChannel.None is the equivalent of sending false.

            NotificationChannel.Email is the equivalent of sending true.

            If the NotificationChannel property is used/sent this property will be ignored.'
          type: boolean
        NotificationChannel:
          description: 'Which channel is used for sending notifications to the recipient.

            Default Email if not specified.'
          enum:
          - None
          - Email
          - Sms
          - WhatsApp
          type: string
        AllowAccessAfterFinish:
          description: 'If true, the recipient is allowed to access the action after it has been finished.

            It is required that the organization has the AllowAccessFinishedWorkstep feature enabled.

            The default value is taken from the OrganizationSettings.'
          type: boolean
        IncludedEmailAppLinks:
          $ref: '#/components/schemas/EnvelopeActivityReplaceEmailAppLinks'
          description: The configuration for mobile app links in email messages.
        AllowDelegation:
          description: If true, the recipient may delegate this activity to another person.
          type: boolean
        RequireViewContentBeforeFormFilling:
          description: If true, the signer has to confirm the reading of all documents as first task.
          type: boolean
    EnvelopeActivityReplaceClickToSignSignatureType:
      description: The configuration of the signature image.
      type: object
      properties:
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceClickToSignStampImprint'
          description: The configuration of the stamp imprint of the signature.
    EnvelopeActivityReplacePluginStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayEmail:
          description: If true, the email address of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeActivityReplaceSize:
      description: The definition of the size of an element.
      required:
      - Width
      - Height
      type: object
      properties:
        Width:
          format: double
          description: The width of the element in points.
          type: number
        Height:
          format: double
          description: The height of the element in points.
          type: number
    EnvelopeActivityReplaceSignaturePluginSignatureData:
      description: The recipient configuration for signing with a signature plugin.
      type: object
      properties:
        PluginId:
          description: The identifier of the signature plugin.
          maxLength: 500
          minLength: 0
          type: string
        Fields:
          description: The plugin parameters referred to as the GSP sender data fields.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceSignaturePluginParameter'
    EnvelopeActivityReplaceRadioButtonGroup:
      description: The configuration of the radio button group.
      required:
      - SelectedItem
      - DocumentNumber
      type: object
      properties:
        GroupName:
          description: The name of the radio button group.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        SelectedItem:
          description: The export value of the selected item of the radio button group.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        GuidingOrder:
          description: The order of the element.
          type: integer
    EnvelopeActivityReplaceDrawToSignStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayEmail:
          description: If true, the email address of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeActivityReplaceSignatureDataConfiguration:
      description: The recipient configuration for signing.
      type: object
      properties:
        DisposableCertificate:
          $ref: '#/components/schemas/EnvelopeActivityReplaceDisposableCertificateSignatureData'
          description: The disposable certificate configuration for the action.
        RemoteCertificate:
          $ref: '#/components/schemas/EnvelopeActivityReplaceRemoteCertificateSignatureData'
          description: The remote certificate configuration for the action.
        SwissComOnDemand:
          $ref: '#/components/schemas/EnvelopeActivityReplaceSwissComOnDemandSignatureData'
          description: The Swisscom On-Demand certificate configuration for the action.
        SmsOneTimePassword:
          $ref: '#/components/schemas/EnvelopeActivityReplaceSmsOneTimePasswordSignatureData'
          description: The one time password configuration for the action (SMS-OTP).
        ATrustCertificate:
          $ref: '#/components/schemas/EnvelopeActivityReplaceATrustCertificateSignatureData'
          description: The A-Trust certificate configuration for the action.
        SwedishBankId:
          $ref: '#/components/schemas/EnvelopeActivityReplaceSwedishBankIdSignatureData'
          description: The Swedish BankID configuration for the action.
        SignaturePluginData:
          description: The signature plugin configurations for the action.
          maxItems: 20
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceSignaturePluginSignatureData'
    EnvelopeActivityReplaceRemoteCertificateStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeActivityReplaceEmailAppLinks:
      description: Configure if links for our apps should be included in the recipient document signing request email message.
      type: object
      properties:
        Android:
          description: If true, an Android app link is added to the email message.
          type: boolean
        iOS:
          description: If true, an iOS app link is added to the email message.
          type: boolean
        Windows:
          description: If true, a Windows app link is added to the email message.
          type: boolean
    EnvelopeActivityReplaceOAuthAuthentication:
      description: The configuration for authentication with an OAuth provider.
      type: object
      properties:
        ProviderName:
          description: The name of the OAuth provider.
          maxLength: 500
          minLength: 0
          type: string
        Validations:
          description: The validation rules for the OAuth response.
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceAuthenticationValidation'
    EnvelopeActivityReplaceLinkDefinition:
      description: The settings of a positionable element.
      required:
      - Position
      - Size
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/EnvelopeActivityReplacePosition'
          description: The position of the element within the document.
        Size:
          $ref: '#/components/schemas/EnvelopeActivityReplaceSize'
          description: The size of the element.
    EnvelopeActivityReplaceRemoteCertificateSignatureData:
      description: The recipient configuration for signing with a remote certificate.
      type: object
      properties:
        UserId:
          description: The identifier of the user.
          maxLength: 500
          minLength: 0
          type: string
        DeviceId:
          description: The identifier of the device.
          maxLength: 500
          minLength: 0
          type: string
    EnvelopeActivityReplaceATrustCertificateSignatureData:
      description: The recipient configuration for signing with an A-Trust certificate.
      type: object
      properties:
        PhoneNumber:
          description: The phone number of the recipient.
          maxLength: 250
          minLength: 0
          pattern: ^(\+|00){1}\(?([0-9]{2,})\)?([\-. ]?([0-9]{2,})){1,}$
          type: string
    ErrorResponse:
      description: Error object that is returned when the api call was not processed successfully.
      type: object
      properties:
        ErrorId:
          description: Id of the error.
          type: string
        Message:
          description: Message from the error.
          type: string
        TraceId:
          description: Trace identifier.
          type: string
    EnvelopeActivityReplaceLocalCertificateSignatureType:
      description: The configuration of the LocalCertificate signature.
      type: object
      properties:
        EnforcePreferredHashAlgorithm:
          description: If true, the usage of the preferred hash algorithm is enforced.
          type: boolean
        PreferredHashAlgorithm:
          description: The preferred hash algorithm.
          enum:
          - Sha256
          - Sha512
          type: string
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceLocalCertificateStampImprint'
          description: The configuration of the stamp imprint of the signature.
    EnvelopeActivityReplaceGeneralPoliciesForViewAction:
      description: Define the general policies allowed for view action.
      type: object
      properties:
        AllowSaveDocument:
          description: If true, the client is allowed to save the workstep document.
          type: boolean
        AllowSaveAuditTrail:
          description: If true, the client is allowed to save the audittrail document.
          type: boolean
        AllowPrintDocument:
          description: If true, the client is allowed to print the workstep document.
          type: boolean
    EnvelopeActivityReplaceReadingAreaDefinition:
      description: The settings of a positionable element.
      required:
      - Position
      - Size
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/EnvelopeActivityReplacePosition'
          description: The position of the element within the document.
        Size:
          $ref: '#/components/schemas/EnvelopeActivityReplaceSize'
          description: The size of the element.
    EnvelopeActivityReplaceAuthenticationValidation:
      description: A validation rule for an authentication response.
      type: object
      properties:
        FieldReferenceId:
          description: The identifier of the field.
          maxLength: 500
          minLength: 0
          type: string
        ExpectedValue:
          description: The expected value of the field.
          maxLength: 500
          minLength: 0
          type: string
    EnvelopeActivityReplaceTextFormat:
      description: The configuration of the text format.
      type: object
      properties:
        TextColor:
          description: 'The color of the text. The default color is black.

            Six digit hexadecimal color that starts with # in #RRGGBB format according to CSS Color Module Level 4, paragraph 5.2.'
          maxLength: 7
          minLength: 7
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: number
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        Bold:
          description: If true, the bold font is used.
          type: boolean
        Italic:
          description: If true, the italic font is used.
          type: boolean
        TextAlign:
          description: The alignment of the text. The default alignment is left.
          enum:
          - Left
          - Center
          - Right
          type: string
    EnvelopeActivityReplaceDisposableCertificateSignatureData:
      description: The recipient configuration for signing with a disposable certificate.
      type: object
      properties:
        DocumentIssuingCountry:
          description: 'The issuing country of the document.

            Will be used as country of residence, if lean is disabled.'
          maxLength: 500
          minLength: 0
          type: string
        IdentificationIssuingCountry:
          description: The issuing country of the identification.
          maxLength: 500
          minLength: 0
          type: string
        IdentificationType:
          description: The type of identification in use.
          enum:
          - None
          - ForeignTaxCode
          - PersonalNumber
          - Passport
          - NationalIdentityCard
          - ItalianTaxCode
          - NoSerialNumber
          - DrivingLicense
          - ResidencePermit
          - TemporaryResidencePermit
          - EmbassyDocument
          - AML
          type: string
          x-ms-enum:
            name: DisposableCertificateIdentificationType
            modelAsString: false
        PhoneNumber:
          description: The phone number registered for identification.
          maxLength: 250
          minLength: 0
          pattern: ^(\+|00){1}\(?([0-9]{2,})\)?([\-. ]?([0-9]{2,})){1,}$
          type: string
        DocumentType:
          description: The type of document used for the identification.
          enum:
          - IdentityCard
          - DriverLicense
          - Passport
          - ResidencePermit
          - NationalElectronicIdentityCard
          - TemporaryResidencePermit
          - EmbassyDocument
          type: string
        DocumentIssuedBy:
          description: The authority that issued the document.
          maxLength: 500
          minLength: 0
          type: string
        DocumentIssuedOn:
          format: date
          description: 'The date when the document has been issued.

            A date in the format RFC 3339, section 5.6, ''full-date'' (e.g. 2017-07-21).'
          maxLength: 10
          minLength: 10
          type: string
        DocumentExpiryDate:
          format: date
          description: 'The expiration date of the document.

            A date in the format RFC 3339, section 5.6, ''full-date'' (e.g. 2017-07-21).'
          maxLength: 10
          minLength: 10
          type: string
        SerialNumber:
          description: The serial number of the certificate.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          description: The identifier of the document.
          maxLength: 500
          minLength: 0
          type: string
    EnvelopeActivityReplaceGeneralPoliciesForSignAction:
      description: Define the general policies allowed for sign action.
      type: object
      properties:
        AllowSaveDocument:
          description: If true, the client is allowed to save the workstep document.
          type: boolean
        AllowSaveAuditTrail:
          description: If true, the client is allowed to save the audittrail document.
          type: boolean
        AllowPrintDocument:
          description: If true, the client is allowed to print the workstep document.
          type: boolean
        AllowAdhocPdfAttachments:
          description: If true, the client is allowed to append adhoc documents.
          type: boolean
        AllowRejectWorkstep:
          description: If true, the client is allowed to reject the workstep.
          type: boolean
        AllowUndoLastAction:
          description: If true, the client is allowed to undo actions.
          type: boolean
    EnvelopeActivityReplaceSwedishBankIdAuthentication:
