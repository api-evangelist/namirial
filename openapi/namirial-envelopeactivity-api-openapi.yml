          description: The configuration of the authentication with Swedish BankID.
        OAuthAuthentications:
          description: The configurations of the authentication with OAuth.
          maxItems: 20
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceOAuthAuthentication'
        SamlAuthentications:
          description: The configurations of the authentication with SAML.
          maxItems: 20
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceSamlAuthentication'
