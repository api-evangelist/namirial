          description: 'Obsolete: If true, emails will be sent out for this recipient.

            Use NotificationChannel property instead, which also allows sending with other notification channels than Email.

            NotificationChannel.None is the equivalent of sending false.

            NotificationChannel.Email is the equivalent of sending true.

            If the NotificationChannel property is used/sent this property will be ignored.'
          type: boolean
