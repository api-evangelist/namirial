    EnvelopeActivityReplaceAttachment:
      description: The configuration of the attachment element.
      required:
      - DocumentNumber
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Required:
          description: If true, the element is required.
          type: boolean
        DisplayName:
          description: The displayed name.
          maxLength: 500
          minLength: 0
          type: string
        DisplayIconType:
          description: The type of the displayed icon. If no icon is provided Paperclip will be used.
          enum:
          - Paperclip
          - Graph
          - PushPin
          - Tag
          type: string
        GuidingOrder:
          description: The order of the element.
          type: integer
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeActivityReplaceAttachmentDefinition'
          description: 'The definition of the attachment element.

            It must be specified when the attachment element is added.

            It must not be specified when the attachment element already exists.'
    EnvelopeActivityReplaceFieldValidation:
      description: The configuration of the field validation rules.
      type: object
      properties:
        Type:
          description: The type of the value.
          enum:
          - None
          - Date
          - Email
          - Number
          - Phone
          - Time
          type: string
          x-ms-enum:
            name: FieldValidationType
            modelAsString: false
        DateValidationConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceDateValidationConfiguration'
          description: The validation rules for dates.
        NumberValidationConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceNumberValidationConfiguration'
          description: The validation rules for numbers.
        PhoneValidationConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplacePhoneValidationConfiguration'
          description: The validation rules for phone numbers.
        TimeValidationConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceTimeValidationConfiguration'
          description: The validation rules for time values.
    EnvelopeActivityReplaceRemoteCertificateSignatureType:
      description: The configuration of the RemoteCertificate signature.
      type: object
      properties:
        ValidityInSeconds:
          description: The validity of the certificate in seconds.
          type: integer
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceRemoteCertificateStampImprint'
          description: The configuration of the stamp imprint of the signature.
    EnvelopeActivityReplaceSign:
      description: A sign action for the recipient.
      type: object
      properties:
        RecipientConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceAdvancedRecipientConfiguration'
          description: The configuration of the recipient.
        Elements:
          $ref: '#/components/schemas/EnvelopeActivityReplaceElements'
          description: The elements in the document (e.g. form fields) assigned to the recipient.
        FinishActionConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceFinishAction'
          description: Defines what happens in the signing clients, after an action has been finished.
        SignatureDataConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceSignatureDataConfiguration'
          description: The configuration of recipient data for special signatures.
        BatchConfiguration:
          $ref: '#/components/schemas/EnvelopeActivityReplaceBatchConfiguration'
          description: The configuration of a signing batch.
        SequenceMode:
          description: The sequence mode.
          enum:
          - NoSequenceEnforced
          - SequenceEnforced
          type: string
        GeneralPoliciesOverrides:
          $ref: '#/components/schemas/EnvelopeActivityReplaceGeneralPoliciesForSignAction'
          description: Viewer policy settings for override.
    EnvelopeActivityReplaceAllowedSignatureTypes:
      description: The definition of the allowed signature types for the signature.
      type: object
      properties:
        ClickToSign:
          $ref: '#/components/schemas/EnvelopeActivityReplaceClickToSignSignatureType'
          description: Allow signing with "click to sign".
        DrawToSign:
          $ref: '#/components/schemas/EnvelopeActivityReplaceDrawToSignSignatureType'
          description: Allow signing with "draw to sign".
        TypeToSign:
          $ref: '#/components/schemas/EnvelopeActivityReplaceTypeToSignSignatureType'
          description: Allow signing with "type to sign".
        LocalCertificate:
          $ref: '#/components/schemas/EnvelopeActivityReplaceLocalCertificateSignatureType'
          description: Allow signing with a local certificate.
        DisposableCertificate:
          $ref: '#/components/schemas/EnvelopeActivityReplaceDisposableCertificateSignatureType'
          description: Allow signing with a disposable certificate.
        SwissComOnDemand:
          $ref: '#/components/schemas/EnvelopeActivityReplaceSwissComOnDemandSignatureType'
          description: Allow signing with a Swisscom On-Demand certificate.
        ATrustCertificate:
          $ref: '#/components/schemas/EnvelopeActivityReplaceATrustCertificateSignatureType'
          description: Allow signing with an A-Trust certificate.
        Biometric:
          $ref: '#/components/schemas/EnvelopeActivityReplaceBiometricSignatureType'
          description: Allow signing with a biometric signature.
        RemoteCertificate:
          $ref: '#/components/schemas/EnvelopeActivityReplaceRemoteCertificateSignatureType'
          description: Allow signing with a remote certificate.
        OneTimePassword:
          $ref: '#/components/schemas/EnvelopeActivityReplaceOneTimePasswordSignatureType'
          description: Allow signing with a one time password (SMS-OTP).
        SwedishBankId:
          $ref: '#/components/schemas/EnvelopeActivityReplaceSwedishBankIdSignatureType'
          description: Allow signing with Swedish BankID.
        SignaturePlugins:
          description: Allow signing with signature plugins.
          maxItems: 20
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeActivityReplaceSignaturePluginSignatureType'
    EnvelopeActivityReplaceStampImprintDateConfiguration:
      description: The configuration of the stamp imprint date.
      type: object
      properties:
