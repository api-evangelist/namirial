openapi: 3.2.0
info:
  title: Namirial Draft API
  version: v6
  description: 'Operations tagged Draft across 2 of this provider''s published API definitions: namirial-esignanywhere-v6-swagger.json, namirial-esignanywhere-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
- url: https://saas.esignanywhere.net/api
tags:
- name: Draft
paths:
  /v6/draft/{draftId}:
    get:
      tags:
      - Draft
      summary: Get an overview of a draft
      operationId: Draft_Get
      parameters:
      - name: draftId
        in: path
        description: The identifier of the draft.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftGetResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DraftGetResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/draft/{draftId}/files:
    get:
      tags:
      - Draft
      summary: Get the documents of a draft
      operationId: Draft_GetFiles
      parameters:
      - name: draftId
        in: path
        description: The identifier of the draft.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftGetFilesResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DraftGetFilesResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/draft/{draftId}/elements:
    get:
      tags:
      - Draft
      summary: Get the elements belonging to the documents of a draft
      operationId: Draft_GetElements
      parameters:
      - name: draftId
        in: path
        description: The identifier of the draft.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftGetElementsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DraftGetElementsResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/draft/{draftId}/configuration:
    get:
      tags:
      - Draft
      summary: Get the configuration of a draft and its activities
      operationId: Draft_GetConfiguration
      parameters:
      - name: draftId
        in: path
        description: The identifier of the draft.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftGetConfigurationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DraftGetConfigurationResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/draft/find:
    post:
      tags:
      - Draft
      summary: Get basic information about drafts which match your filter criteria
      operationId: Draft_Find
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftFindResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DraftFindResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftFindRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DraftFindRequest'
        description: The filter criteria.
        required: true
    servers:
    - url: /api
  /v6/draft/send:
    post:
      tags:
      - Draft
      summary: Send a draft
      operationId: Draft_SendDraft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftSendResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DraftSendResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftSendRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DraftSendRequest'
        description: The model containing the send options.
        required: true
    servers:
    - url: /api
  /v6/draft/create:
    post:
      tags:
      - Draft
      summary: Create a new draft
      operationId: Draft_Create
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCreateResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DraftCreateResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DraftCreateRequest'
        description: The definition of the draft.
        required: true
    servers:
    - url: /api
  /v6/draft/delete:
    post:
      tags:
      - Draft
      summary: Delete a draft
      operationId: Draft_Delete
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Void'
            text/json:
              schema:
                $ref: '#/components/schemas/Void'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftDeleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DraftDeleteRequest'
        description: The identifier of the draft.
        required: true
    servers:
    - url: /api
  /v6/draft/update:
    post:
      tags:
      - Draft
      summary: Update the configuration of the draft
      operationId: Draft_Update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Void'
            text/json:
              schema:
                $ref: '#/components/schemas/Void'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftUpdateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DraftUpdateRequest'
        description: The model containing the requested changes.
        required: true
    servers:
    - url: /api
  /v6/draft/reorderactivities:
    post:
      tags:
      - Draft
      summary: Reorder the activities of a draft
      operationId: Draft_ReorderActivities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Void'
            text/json:
              schema:
                $ref: '#/components/schemas/Void'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftReorderActivitiesRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DraftReorderActivitiesRequest'
        description: The new order of all the activities.
        required: true
    servers:
    - url: /api
components:
  schemas:
    DraftGetElementsListBoxDefinition:
      description: The configuration of the list box.
      type: object
      properties:
        TextFormat:
          $ref: '#/components/schemas/DraftGetElementsTextFormat'
          description: The configuration of the text format.
        Items:
          description: A list of items that can be selected for the element.
          type: array
          items:
            $ref: '#/components/schemas/DraftGetElementsChoiceItem'
        IsMultiSelect:
          description: If true, multiple values of the list box can be selected.
          type: boolean
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
        Position:
          $ref: '#/components/schemas/DraftGetElementsPosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/DraftGetElementsSize'
          description: The size of the form field.
    DraftCreateSwedishBankIdSignatureType:
      description: The configuration of the signature.
      type: object
      properties:
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/DraftCreateSwedishBankIdStampImprint'
          description: The configuration of the stamp imprint of the signature.
    DraftCreateSignaturePluginSignatureData:
      description: The recipient configuration for signing with a signature plugin.
      type: object
      properties:
        PluginId:
          description: The identifier of the signature plugin.
          maxLength: 500
          minLength: 0
          type: string
        Fields:
          description: The plugin parameters referred to as the GSP sender data fields.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/DraftCreateSignaturePluginParameter'
    DraftGetElementsListBox:
      description: The configuration of the list box.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Required:
          description: If true, the element is required.
          type: boolean
        PreSelectedItems:
          description: The export values of the items which should be initially selected.
          type: array
          items:
            type: string
        GuidingOrder:
          format: int32
          description: The order of the element.
          type: integer
        Source:
          description: The element source from where a field originates.
          enum:
          - Document
          - AdvancedDocumentTag
          - UserDefined
          type: string
          x-ms-enum:
            name: FormFieldSource
            modelAsString: false
        FieldDefinition:
          $ref: '#/components/schemas/DraftGetElementsListBoxDefinition'
          description: The definition of the list box field.
    DraftGetElementsClickToSignStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        FontSizeInPt:
          format: int32
          description: The size of the font in points.
          type: integer
        DisplayEmail:
          description: If true, the email address of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    DraftGetConfigurationGeneralPoliciesForViewAction:
      description: Define the general policies allowed for view action.
      type: object
      properties:
        AllowSaveDocument:
          description: If true, the client is allowed to save the workstep document.
          type: boolean
        AllowSaveAuditTrail:
          description: If true, the client is allowed to save the audittrail document.
          type: boolean
        AllowPrintDocument:
          description: If true, the client is allowed to print the workstep document.
          type: boolean
    DraftGetSign:
      description: An action to sign documents.
      type: object
      properties:
        ContactInformation:
          $ref: '#/components/schemas/DraftGetContactInformation'
          description: The contact information of the recipient.
        SigningGroup:
          format: int32
          description: The parallel group for sign actions.
          type: integer
    DraftCreateTextBox:
      description: The configuration of the text box.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        Value:
          description: The value of the text box.
          maxLength: 204800
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        GuidingOrder:
          description: The order of the element.
          type: integer
        Validation:
          $ref: '#/components/schemas/DraftCreateFieldValidation'
          description: The configuration of the validation rules for the text box value.
        FieldDefinition:
          $ref: '#/components/schemas/DraftCreateTextBoxDefinition'
          description: 'The definition of the text box.

            It must be specified when the check box is added.

            It must not be specified when the check box already exists.'
    DraftGetConfigurationAgreementConfiguration:
      description: The configuration of the agreement.
      type: object
      properties:
        Translations:
          description: 'The agreement and its translations to be used.

            If no custom agreement is specified, the default organization agreement will be used.'
          type: array
          items:
            $ref: '#/components/schemas/DraftGetConfigurationAgreementTranslation'
    DraftGetElementsChoiceItem:
      description: The configuration of the choice item.
      type: object
      properties:
        ExportValue:
          description: The value of the element when the choice item is selected.
          type: string
        DisplayValue:
          description: The displayed value of the choice item.
          type: string
    DraftGetConfigurationAction:
      description: The action of the activity.
      type: object
      properties:
        SendCopy:
          $ref: '#/components/schemas/DraftGetConfigurationSendCopy'
          description: The configuration of the copy action.
        Sign:
          $ref: '#/components/schemas/DraftGetConfigurationSign'
          description: The configuration of the sign action.
        View:
          $ref: '#/components/schemas/DraftGetConfigurationView'
          description: The configuration of the view action.
        SignAsP7M:
          $ref: '#/components/schemas/DraftGetConfigurationSignAsP7M'
          description: The configuration of the P7M sign action.
        SignBulk:
          $ref: '#/components/schemas/DraftGetConfigurationSignBulk'
          description: The definition of the bulk.
    DraftGetConfigurationSamlAuthentication:
      description: The configuration for authentication with a SAML provider.
      type: object
      properties:
        ProviderName:
          description: The name of the SAML provider.
          type: string
        Validations:
          description: The validation rules for the SAML response.
          type: array
          items:
            $ref: '#/components/schemas/DraftGetConfigurationAuthenticationValidation'
    DraftGetConfigurationAccessCodeAuthentication:
      description: The configuration for authentication with a predefined access code.
      type: object
      properties:
        Code:
          description: The code for authenticating the recipient.
          type: string
    DraftGetConfigurationEmailAppLinks:
      description: Configure if links for our Apps should be included in the document signing request email message.
      type: object
      properties:
        Android:
          description: If true, an Android app link is added to the email message.
          type: boolean
        iOS:
          description: If true, an iOS app link is added to the email message.
          type: boolean
        Windows:
          description: If true, a Windows app link is added to the email message.
          type: boolean
    DraftGetSignAsP7M:
      description: An action to sign documents with P7M.
      type: object
      properties:
        ContactInformation:
          $ref: '#/components/schemas/DraftGetContactInformation'
          description: The contact information of the recipient.
        SignAsP7MGroup:
          format: int32
          description: The parallel group for P7M actions.
          type: integer
    DraftCreateRemoteCertificateSignatureType:
      description: The configuration of the RemoteCertificate signature.
      type: object
      properties:
        ValidityInSeconds:
          description: The validity of the certificate in seconds.
          type: integer
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/DraftCreateRemoteCertificateStampImprint'
          description: The configuration of the stamp imprint of the signature.
    DraftCreateRemoteCertificateSignatureData:
      description: The recipient configuration for signing with a remote certificate.
      type: object
      properties:
        UserId:
          description: The identifier of the user.
          maxLength: 500
          minLength: 0
          type: string
        DeviceId:
          description: The identifier of the device.
          maxLength: 500
          minLength: 0
          type: string
    DraftCreateAppFinishAction:
      description: Define actions for different clients that will trigger after an action has been finished.
      type: object
      properties:
        RemoveDocumentFromRecentDocumentList:
          description: If true, the document will be removed from the recent document list.
          type: boolean
        CallClientActionOnlyAfterSuccessfulSync:
          description: If true, the client action will be called only after a successful sync.
          type: boolean
        CloseApp:
          description: If true, the app will be closed.
          type: boolean
        RedirectUri:
          description: The redirect uri.
          maxLength: 8000
          minLength: 0
          type: string
    DraftGetConfigurationActivity:
      description: Defines an activity with the possibility of bulk.
      type: object
      properties:
        Id:
          description: The identifier of the activity.
          type: string
        Action:
          $ref: '#/components/schemas/DraftGetConfigurationAction'
          description: The action assigned to the activity.
        VisibilityOptions:
          description: The document visibility options for the activity.
          type: array
          items:
            $ref: '#/components/schemas/DraftGetConfigurationVisibilityOption'
    DraftUpdateCallbackConfiguration:
      description: The configuration of the callbacks for a custom integration.
      type: object
      properties:
        CallbackUrl:
          description: The callback URL triggered when the envelope has been finished.
          maxLength: 8000
          minLength: 0
          type: string
        StatusUpdateCallbackUrl:
          description: The callback URL triggered for status updates of an envelope.
          maxLength: 8000
          minLength: 0
          type: string
        AfterSendCallbackUrl:
          description: The callback URL triggered after sending the draft.
          maxLength: 8000
          minLength: 0
          type: string
        ActivityActionCallbackConfiguration:
          $ref: '#/components/schemas/DraftUpdateActivityActionCallbackConfiguration'
          description: The configuration of the callback for workstep events.
    DraftCreateAttachment:
      description: The configuration of the attachment element.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Required:
          description: If true, the element is required.
          type: boolean
        DisplayName:
          description: The displayed name.
          maxLength: 500
          minLength: 0
          type: string
        DisplayIconType:
          description: The type of the displayed icon. If no icon is provided Paperclip will be used.
          enum:
          - Paperclip
          - Graph
          - PushPin
          - Tag
          type: string
        GuidingOrder:
          description: The order of the element.
          type: integer
        FieldDefinition:
          $ref: '#/components/schemas/DraftCreateAttachmentDefinition'
          description: 'The definition of the attachment element.

            It must be specified when the attachment element is added.

            It must not be specified when the attachment element already exists.'
    DraftCreateBiometricSignatureType:
      description: The configuration of the Biometric signature.
      type: object
      properties:
        BiometricVerification:
          description: If true, a biometric verification is performed.
          type: boolean
        AllowBiometricStoringOnly:
          description: If true, the biometric signature might be stored without verification.
          type: boolean
        StoreSignedResponseWithoutBioData:
          description: If true, the signed response is stored without biometric data.
          type: boolean
        BiometricServerUserId:
          description: The identifier of the user on the biometric server.
          maxLength: 50
          minLength: 0
          type: string
        SignaturePositioning:
          description: The allowed positioning of the biometric signature.
          enum:
          - WithinField
          - OnPage
          - IntersectsWithField
          type: string
