openapi: 3.2.0
info:
  title: Namirial Organizations Instances API
  version: 1.5.1
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: 'Operations tagged OrganizationsInstances across 2 of this provider''s published API definitions: namirial-connectors-apis.yaml, namirial-connectors-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://esaw-conn-test.namirialtsp.com
  description: (Development)
tags:
- name: OrganizationsInstances
  description: Manage association between organizations and instances
  externalDocs:
    description: Documentation
    url: https://doc.namirial.com/esaw-connectors/organizationsInstances
paths:
  /auth/organizationsInstances:
    post:
      tags:
      - OrganizationsInstances
      summary: Assign an instance to an organization
      security:
      - oAuth2AuthCode: []
      - oAuth2ClientCredentials: []
      requestBody:
        description: A JSON object containing organization and instance information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInstance'
            examples:
              detail:
                $ref: '#/components/examples/OrganizationInstanceExample'
      responses:
        '201':
          description: An instance was assigned to an organization
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/EntityNotFoundError'
        '400':
          $ref: '#/components/responses/InvalidInputError'
      operationId: postAuthOrganizationsInstances
      x-operation-id-source: derived
    servers:
    - url: https://esaw-conn-test.namirialtsp.com
      description: (Development)
  /auth/organizationsInstances/{organizationId}/{instanceId}:
    delete:
      tags:
      - OrganizationsInstances
      summary: Remove an instance from an organization
      security:
      - oAuth2AuthCode: []
      - oAuth2ClientCredentials: []
      parameters:
      - in: path
        name: organizationId
        schema:
          type: string
        required: true
        description: Organization Identifier
        example: d6c908d0-bce6-40e1-a5cd-1152a18a5054
      - in: path
        name: instanceId
        schema:
          type: string
        required: true
        description: Instance Identifier
        example: 86bba44d-e14d-44a5-8662-4edaa3eebb83
      responses:
        '200':
          description: An instance was removed from an organization
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/EntityNotFoundError'
        '400':
          $ref: '#/components/responses/InvalidInputError'
      operationId: deleteAuthOrganizationsInstancesByOrganizationIdByInstanceId
      x-operation-id-source: derived
    servers:
    - url: https://esaw-conn-test.namirialtsp.com
      description: (Development)
components:
  schemas:
    OrganizationInstance:
      type: object
      properties:
        organizationId:
          type: string
          description: Id of selected organization
        instanceId:
          type: string
          description: Id of selected instance
  responses:
    EntityNotFoundError:
      description: Entity described by identifier not found
    UnauthorizedError:
      description: Access token is missing or invalid
    InvalidInputError:
      description: Input Entity is invalid
  examples:
    OrganizationInstanceExample:
      value:
        organizationId: 19bdadc5-47d0-4d6b-a97a-98fc307a2843
        instanceId: 21fc40b4-f415-4902-abca-5cdf042142c9
  securitySchemes:
    oAuth2AuthCode:
      type: oauth2
      description: This API uses OAuth 2 with the authorization code grant flow.
      flows:
        authorizationCode:
          authorizationUrl: /auth/authorize
          tokenUrl: /auth/token
          scopes:
            documents:read: Read documents
            documents:write: Modify documents
            processes:read: Read processes
            processes:write: Modify processes
            auth:read: Read auth
    oAuth2ClientCredentials:
      type: oauth2
      description: This API uses OAuth 2 with the client credentials grant flow.
      flows:
        clientCredentials:
          tokenUrl: /auth/token
          scopes:
            documents:read: Read documents
            documents:write: Modify documents
            processes:read: Read processes
            processes:write: Modify processes
            auth:read: Read auth
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Official eSAW Connectors
  url: https://doc.namirial.com/connectors-apis/latest/
x-refined-from:
- namirial-connectors-apis.yaml
- namirial-connectors-openapi.yml
