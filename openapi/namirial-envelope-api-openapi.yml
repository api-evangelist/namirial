openapi: 3.2.0
info:
  title: Namirial Envelope API
  version: v6
  description: 'Operations tagged Envelope across 2 of this provider''s published API definitions: namirial-esignanywhere-v6-swagger.json, namirial-esignanywhere-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
- url: https://saas.esignanywhere.net/api
tags:
- name: Envelope
paths:
  /v6/envelope/{envelopeId}:
    get:
      tags:
      - Envelope
      summary: Get an overview of an envelope
      operationId: Envelope_Get
      parameters:
      - name: envelopeId
        in: path
        description: The identifier of the envelope.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGetResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGetResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
