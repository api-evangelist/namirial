          description: The type of identification in use.
          enum:
          - None
          - ForeignTaxCode
          - PersonalNumber
          - Passport
          - NationalIdentityCard
          - ItalianTaxCode
          - NoSerialNumber
          - DrivingLicense
          - ResidencePermit
          - TemporaryResidencePermit
          - EmbassyDocument
          - AML
