          description: The phone number registered for identification.
          type: string
        DocumentType:
          description: The type of document used for the identification.
          enum:
          - IdentityCard
          - DriverLicense
          - Passport
          - ResidencePermit
          - NationalElectronicIdentityCard
          - TemporaryResidencePermit
          - EmbassyDocument
          type: string
          x-ms-enum:
            name: DisposableCertificateDocumentType
            modelAsString: false
        DocumentIssuedBy:
          description: The authority that issued the document.
          type: string
        DocumentIssuedOn:
          format: date
          description: 'The date when the document has been issued.

            A date in the format RFC 3339, section 5.6, ''full-date'' (e.g. 2017-07-21).'
          type: string
        DocumentExpiryDate:
          format: date
          description: 'The expiration date of the document.

            A date in the format RFC 3339, section 5.6, ''full-date'' (e.g. 2017-07-21).'
          type: string
        SerialNumber:
          description: The serial number of the certificate.
          type: string
        DocumentNumber:
          description: The identifier of the document.
          type: string
