    EnvelopeSendDocument:
      description: Define a document.
      required:
      - FileId
      type: object
      properties:
        FileId:
          description: The identifier of the file.
          maxLength: 36
          minLength: 36
          type: string
        DocumentNumber:
          format: int32
          description: 'The document number.

            If the document number is 0 for all documents, the order of the documents is used as number.

            The document number must not be duplicated.

            The document number must be set for all documents or none.'
          type: integer
    EnvelopeSendAccessCodeAuthentication:
      description: The configuration for authentication with a predefined access code.
      required:
      - Code
      type: object
      properties:
        Code:
          description: The code for authenticating the recipient.
          maxLength: 500
          minLength: 0
          type: string
    EnvelopeSendSize:
      description: The definition of the size of an element.
      required:
      - Width
      - Height
      type: object
      properties:
        Width:
          format: double
          description: The width of the element in points.
          type: number
        Height:
          format: double
          description: The height of the element in points.
          type: number
    EnvelopeSendOneTimePasswordStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          maxLength: 500
          minLength: 0
          type: string
        FontSizeInPt:
          description: The size of the font in points.
          type: integer
        DisplayTransactionId:
          description: If true, the transaction identifier is displayed.
          type: boolean
        DisplayTransactionToken:
          description: If true, the transaction token is displayed.
          type: boolean
        DisplayPhoneNumber:
          description: If true, the phone number of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeSendRadioButtonItemDefinition:
      description: The configuration of the radio button.
      required:
      - Position
      - Size
      type: object
      properties:
        ExportValue:
          description: The value of the element when the radio button is checked.
          maxLength: 500
          minLength: 0
          type: string
        IsChecked:
          description: If true, the radio button is checked by default.
          type: boolean
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
        Position:
          $ref: '#/components/schemas/EnvelopeSendPosition'
          description: The position of the element within the document.
        Size:
          $ref: '#/components/schemas/EnvelopeSendSize'
          description: The size of the element.
    EnvelopeSendFullName:
      description: The configuration of the predefined element.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeSendPredefinedElementDefinition'
          description: 'The definition of the predefined element.

            It must be specified when the predefined element is added.

            It must not be specified when the predefined element already exists.'
    EnvelopeGetConfigurationATrustCertificateSignatureData:
      description: The recipient configuration for signing with an A-Trust certificate.
      type: object
      properties:
        PhoneNumber:
          description: The phone number of the recipient.
          type: string
    EnvelopeSendDrawToSignSignatureType:
      description: The configuration of the signature image.
      type: object
      properties:
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: 'If true, the signature type is set as preferred.

            Only one signature type may be marked.'
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/EnvelopeSendDrawToSignStampImprint'
          description: The configuration of the stamp imprint of the signature.
    EnvelopeGetElementsActivity:
      description: Defines an activity in the process.
      type: object
      properties:
        Id:
          description: The identifier of the activity.
          type: string
        Action:
          $ref: '#/components/schemas/EnvelopeGetElementsAction'
          description: The action assigned to the activity.
    EnvelopeSendReadingAreaDefinition:
      description: The settings of a positionable element.
      required:
      - Position
      - Size
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/EnvelopeSendPosition'
          description: The position of the element within the document.
        Size:
          $ref: '#/components/schemas/EnvelopeSendSize'
          description: The size of the element.
    EnvelopeGetElementsTextBoxDefinition:
      description: The configuration of the text box.
      type: object
      properties:
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
        MaxLength:
          format: int32
          description: The maximum length of the text.
          type: integer
        IsMultiline:
          description: If true, the text box can have multiple lines.
          type: boolean
        IsPassword:
          description: If true, the text box behaves like a password input field and does not show the actually entered characters.
          type: boolean
        TextFormat:
          $ref: '#/components/schemas/EnvelopeGetElementsTextFormat'
          description: The configuration of the text format.
        Position:
          $ref: '#/components/schemas/EnvelopeGetElementsPosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/EnvelopeGetElementsSize'
          description: The size of the form field.
    EnvelopeGetLongLivedDisposableCertificateWarning:
      description: A warning for a long lived disposable certificate.
      type: object
      properties:
        RequestId:
          description: The identifier of the request.
          type: string
        RemoteDeviceId:
          description: The identifier of the remote device.
          type: string
    EnvelopeSendCheckBox:
      description: The configuration of the check box.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Required:
          description: If true, the element is required.
          type: boolean
        IsChecked:
          description: If true, the check box is checked.
          type: boolean
        GuidingOrder:
          description: The order of the element.
          type: integer
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeSendCheckBoxDefinition'
          description: 'The definition of the check box.

            It must be specified when the check box is added.

            It must not be specified when the check box already exists.'
    EnvelopeGetConfigurationReminderConfiguration:
      description: The configuration for reminders.
      type: object
      properties:
        Enabled:
          description: If true, reminders are sent.
          type: boolean
        FirstReminderInDays:
          format: int32
          description: The amount of days until a reminder is sent to a signer or a viewer after the initial notification.
          type: integer
        ReminderResendIntervalInDays:
          format: int32
          description: The amount of days until a reminder is sent again to a signer or a viewer.
          type: integer
        BeforeExpirationInDays:
          format: int32
          description: The amount of days before the envelope expires and a reminder should be sent.
          type: integer
    EnvelopeGetElementsSwedishBankIdStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        FontSizeInPt:
          format: int32
          description: The size of the font in points.
          type: integer
        DisplayTransactionId:
          description: If true, the transaction identifier is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    EnvelopeSendP7MSignatureMethods:
      description: The recipient configuration for signing with P7M.
      type: object
      properties:
        LocalCertificate:
          description: If true, a local certificate can be used.
          type: boolean
        DisposableCertificate:
          $ref: '#/components/schemas/EnvelopeSendDisposableCertificateSignatureData'
          description: The disposable certificate configuration for the action.
        RemoteCertificate:
          $ref: '#/components/schemas/EnvelopeSendRemoteCertificateSignatureData'
          description: The remote certificate configuration for the action.
        SignaturePluginData:
          description: The signature plugin configurations for the action.
          maxItems: 20
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeSendSignaturePluginSignatureData'
    EnvelopeSendATrustCertificateSignatureData:
      description: The recipient configuration for signing with an A-Trust certificate.
      type: object
      properties:
        PhoneNumber:
          description: The phone number of the recipient.
          maxLength: 250
          minLength: 0
          pattern: ^(\+|00){1}\(?([0-9]{2,})\)?([\-. ]?([0-9]{2,})){1,}$
          type: string
    EnvelopeSendReadPagesConfirmation:
      description: The page which has to be read.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        DisplayName:
          description: The displayed name.
          maxLength: 500
          minLength: 0
          type: string
        PageNumber:
          format: int32
          description: The number of the page that needs to be read. Starting with 1.
          type: integer
        GuidingOrder:
          description: The order of the element.
          type: integer
    EnvelopeGetElementsStampImprintDateConfiguration:
      description: The configuration of the stamp imprint date
      type: object
      properties:
        UseLocalTimezone:
          description: If true, the local timezone is used.
          type: boolean
