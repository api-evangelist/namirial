components:
  schemas:
    EnvelopeSendSignAsP7M:
      description: An action to sign the documents with P7M.
      required:
      - RecipientConfiguration
      - SignatureMethods
      type: object
      properties:
        RecipientConfiguration:
          $ref: '#/components/schemas/EnvelopeSendAdvancedRecipientConfiguration'
          description: The configuration of the recipient.
        SignatureMethods:
          $ref: '#/components/schemas/EnvelopeSendP7MSignatureMethods'
          description: The configuration of recipient data for P7M signatures.
        SignAsP7MGroup:
          description: The group for defining parallel P7M actions.
          maxLength: 500
          minLength: 0
          type: string
        GeneralPoliciesOverrides:
          $ref: '#/components/schemas/EnvelopeSendGeneralPoliciesForP7MAction'
          description: Viewer policy settings for override.
        ViewerPreferencesOverrides:
          $ref: '#/components/schemas/EnvelopeSendViewerPreferencesForP7MAction'
          description: Viewer preferences settings.
    EnvelopeSendTextBox:
      description: The configuration of the text box.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          maxLength: 500
          minLength: 0
          type: string
        Required:
          description: If true, the element is required.
          type: boolean
        Value:
          description: The value of the text box.
          maxLength: 500
          minLength: 0
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        GuidingOrder:
          description: The order of the element.
          type: integer
        Validation:
          $ref: '#/components/schemas/EnvelopeSendFieldValidation'
          description: The configuration of the validation rules for the text box value.
        FieldDefinition:
          $ref: '#/components/schemas/EnvelopeSendTextBoxDefinition'
          description: 'The definition of the text box.

            It must be specified when the check box is added.

            It must not be specified when the check box already exists.'
    EnvelopeRemindResponse:
      description: The response model after sending reminder notifications.
      type: object
      properties:
        TotalSentReminders:
          format: int32
          description: The amount of reminder notifications which were sent out.
          type: integer
        TotalBlockedByRateLimit:
          format: int32
          description: The amount of skipped reminder notifications due to rate limit.
          type: integer
        TotalBlockedByDisabledEmail:
          format: int32
          description: The amount of skipped reminder notifications due to disabled notification sending for the recipient.
          type: integer
        TotalBlockedByNotificationSetting:
          format: int32
          description: The amount of skipped reminder notifications due to disabled notifications by the user.
          type: integer
    EnvelopeGetConfigurationAgreementTranslation:
      description: A translation for the agreement.
      type: object
      properties:
