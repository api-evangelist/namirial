          type: array
          maxItems: 5
          items:
            oneOf:
              - $ref: '#/components/schemas/EmailAction'
              - $ref: '#/components/schemas/HttpAction'
          discriminator:
            propertyName: type
            mapping:
              http: '#/components/schemas/HttpAction'
              email: '#/components/schemas/EmailAction'
        eventType:
          type: string
          description: "The Esaw Callback event type (The supported event are : envelopeFinished,workstepFinished)"
          example: "envelopeFinished"
      required:
        - eventType
