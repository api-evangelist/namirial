# PATHS
paths:
  # AUTH
  /auth/authorize:
    get:
      tags:
        -  Auth
      summary: Starts an authorization code flow
      parameters:
        - in: query
          name: client_id
          schema:
            type: string
            format: uuid
          required: true
          description: Client identifier. Its the application that needs to authenticate a user in eSAW
          example: 8d8e5b6f-aa41-4cfe-ad1f-f82bf6789618
        - in: query
          name: redirect_uri
          schema:
            type: string
          required: true
          description: Uri to be redirected after eSAW successfull credentials validation
          example: https://localhost/oauth/callback
        - in: query
          name: state
          schema:
            type: string
          required: false
          description: Parameter used to pass values during authentication redirect flow
      responses:
        '302':
          description: Document identifier
          headers:
            Location:
              description: The redirected Uri
        '405':
          description: Invalid input
  /auth/token:
    post:
      tags:
        - Auth
      security:
        - Basic: []
      summary: Returns the Access and Refresh JWT bearer tokens
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: OAuth2 authentication grant type (authorization_code, client_credentials, refresh_token)
                redirect_uri:
                  type: string
                  description: Redirect Uri. It has to be equal to the one specified at the beginning of the authentication flow
                code:
                  type: string
                  description: Authorization code returned from authorize. Used only with grant_type equal to authorization_code
                refresh_token:
                  type: string
                  description: Refresh token returned from token endpoint. Used only with grant_type equal to refresh_token
              required:
                - grant_type
                - redirect_uri
      responses:
        '200':
          description: JWT Bearer Access and Refresh tokens created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTBearerResponse'
        '400':
          description: Invalid input
  /auth/instances/find:
    post:
      tags:
        - Auth
      summary: Return the instance list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationId:
                  type: string
                  description: The connector organization id
                clientId:
                  type: string
                  description: The client Id              
              required:
                - clientId
      responses:
        '200':
          description: The instance list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceListResponse'
        '400':
          description: Invalid input
  /auth/userinfo:
    get:
      tags:
        - Auth
      summary: Get user information
      security:
        - oAuth2AuthCode: []
        - oAuth2ClientCredentials: []
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

