          type: array
          maxItems: 2
          items:
            oneOf:
              - $ref: '#/components/schemas/ProcessFinishedEvent'
            discriminator:
              propertyName: objectType
        recipients:
          type: array
          maxItems: 5
          items:
            oneOf:
              - $ref: '#/components/schemas/Recipient'
            discriminator:
              propertyName: objectType
