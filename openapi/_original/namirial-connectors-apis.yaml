        - oAuth2AuthCode: []
        - oAuth2ClientCredentials: []
      parameters:
        - in: path
          name: processId
          schema:
            type: string
          required: true
          description: Document identifier
          example: 0725bfef-c223-4045-a7a0-49f2b54624c2
      responses:
        '200':
          description: Process response in PDF format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProcessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/EntityNotFoundError'
