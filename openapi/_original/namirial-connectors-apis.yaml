  securitySchemes:
    oAuth2AuthCode:
      type: oauth2
      description: This API uses OAuth 2 with the authorization code grant flow.
      flows:
        authorizationCode:   # <---- OAuth flow(authorizationCode)
          authorizationUrl: /auth/authorize
          tokenUrl: /auth/token
          scopes:
            documents:read: Read documents
            documents:write: Modify documents
            processes:read: Read processes
            processes:write: Modify processes
            auth:read: Read auth
    oAuth2ClientCredentials:
      type: oauth2
      description: This API uses OAuth 2 with the client credentials grant flow.
      flows:
        clientCredentials: # <---- OAuth flow(clientCredentials)
          tokenUrl: /auth/token
          scopes:
            documents:read: Read documents
            documents:write: Modify documents
            processes:read: Read processes
            processes:write: Modify processes
            auth:read: Read auth
    basicAuth:     # <-- arbitrary name for the security scheme
      type: http
      scheme: basic
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    EntityNotFoundError:
      description: Entity described by identifier not found
    EntityFoundError:
      description: Entity described by identifier already exists
    InvalidInputError:
      description: Input Entity is invalid
  schemas:
    EmailAction:
      type: object
      properties:
        type:
          type: string
          description: Action type
          example: "email"
        to:
          type: string
          description: List of recipients emails separed by semicolon (;)
          example: "f.last@mail.com;s.name@mail.com"
          maximum: 500
        cc:
          type: string
          description: List of carbon copy emails separed by semicolon (;)
          example: "f.last@mail.com;s.name@mail.com"
          maximum: 500
        ccn:
          type: string
          description: List of blind carbon copy emails separed by semicolon (;)
          example: "f.last@mail.com;s.name@mail.com"
          maximum: 200
        subject:
          type: string
          description: The email subject
          maximum: 100
        body:
          type: string
          description: The email body
          maximum: 500
      required:
        - type
        - to
        - subject
        - body
