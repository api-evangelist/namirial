openapi: 3.2.0
info:
  title: Namirial File API
  version: v6
  description: 'Operations tagged File across 2 of this provider''s published API definitions: namirial-esignanywhere-v6-swagger.json, namirial-esignanywhere-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
- url: https://saas.esignanywhere.net/api
tags:
- name: File
paths:
  /v6/file/{fileId}:
    get:
      tags:
      - File
      summary: Download a file belonging to a completed envelope
      operationId: File_DownloadCompleted
      parameters:
      - name: fileId
        in: path
        description: The identifier of the file.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/json:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '400':
          description: BadRequest
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/file/delete:
    post:
      tags:
      - File
      summary: Delete an uploaded file
      operationId: File_Delete
      responses:
        '200':
          description: OK
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileDeleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/FileDeleteRequest'
        description: The model containing the delete options.
        required: true
    servers:
    - url: /api
  /v6/file/upload:
    post:
      tags:
      - File
      summary: Upload a file for temporary use
      operationId: File_Upload
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          description: 'HTTP 400: Bad Request. E.g. a HTTP 400 with error information ERR0067 will be thrown when trying to upload a file format not supported, or rejected by the FileContentValidationPlugin.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: UnsupportedMediaType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                File:
                  type: string
                  description: 'Upload a file which is later-on referenced in other API calls by its fileId (e.g. documents of an envelope). Supported file types: PDF (by default), or other formats which can be converted to PDF (docx and others) in case the (optional) document converter is installed and configured. File content might be validated server-side by a FileContentValidationPlugin.'
                  format: binary
              required:
              - File
    servers:
    - url: /api
  /v6/file/prepare:
    post:
      tags:
      - File
      summary: Prepare uploaded files by extracting contained elements, advanced document tags…
      operationId: File_Prepare
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePrepareResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/FilePrepareResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilePrepareRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/FilePrepareRequest'
        description: The model containing the prepare options.
        required: true
    servers:
    - url: /api
components:
  schemas:
    FilePrepareSwedishBankIdSignatureType:
      description: The configuration of the signature.
      type: object
      properties:
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/FilePrepareSwedishBankIdStampImprint'
          description: The configuration of the stamp imprint of the signature.
    FilePrepareCheckBoxDefinition:
      description: The configuration of a check box.
      type: object
      properties:
        ExportValue:
          description: The value of the check box when it is checked.
          type: string
        Position:
          $ref: '#/components/schemas/FilePreparePosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/FilePrepareSize'
          description: The size of the form field.
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
    ErrorResponse:
      description: Error object that is returned when the api call was not processed successfully.
      type: object
      properties:
        ErrorId:
          description: Id of the error.
          type: string
        Message:
          description: Message from the error.
          type: string
        TraceId:
          description: Trace identifier.
          type: string
    FilePrepareOneTimePasswordSignatureType:
      description: The configuration of the OneTimePassword signature.
      type: object
      properties:
        ValidityInSeconds:
          format: int32
          description: The validity of the password in seconds.
          type: integer
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/FilePrepareOneTimePasswordStampImprint'
          description: The configuration of the stamp imprint of the signature.
    FilePrepareRemoteCertificateStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        FontSizeInPt:
          format: int32
          description: The size of the font in points.
          type: integer
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    FilePrepareCheckBox:
      description: The configuration of the check box.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Required:
          description: If true, the element is required.
          type: boolean
        IsChecked:
          description: If true, the check box is checked.
          type: boolean
        GuidingOrder:
          format: int32
          description: The order of the element.
          type: integer
        Source:
          description: The element source from where a field originates.
          enum:
          - Document
          - AdvancedDocumentTag
          - UserDefined
          type: string
          x-ms-enum:
            name: FormFieldSource
            modelAsString: false
        FieldDefinition:
          $ref: '#/components/schemas/FilePrepareCheckBoxDefinition'
          description: The definition of the check box.
    FileDeleteRequest:
      description: The request model to delete an uploaded file.
      required:
      - FileId
      type: object
      properties:
        FileId:
          description: The identifier of the file.
          maxLength: 36
          minLength: 36
          type: string
    FilePrepareLocalCertificateSignatureType:
      description: The configuration of the LocalCertificate signature.
      type: object
      properties:
        EnforcePreferredHashAlgorithm:
          description: If true, the usage of the preferred hash algorithm is enforced.
          type: boolean
        PreferredHashAlgorithm:
          description: The preferred hash algorithm.
          enum:
          - Sha256
          - Sha512
          type: string
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/FilePrepareLocalCertificateStampImprint'
          description: The configuration of the stamp imprint of the signature.
    FilePrepareOneTimePasswordStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        FontSizeInPt:
          format: int32
          description: The size of the font in points.
          type: integer
        DisplayTransactionId:
          description: If true, the transaction identifier is displayed.
          type: boolean
        DisplayTransactionToken:
          description: If true, the transaction token is displayed.
          type: boolean
        DisplayPhoneNumber:
          description: If true, the phone number of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    FilePrepareAllowedSignatureTypes:
      description: The definition of the allowed signature types for the signature.
      type: object
      properties:
        ClickToSign:
          $ref: '#/components/schemas/FilePrepareClickToSignSignatureType'
          description: Allow signing with "click to sign".
        DrawToSign:
          $ref: '#/components/schemas/FilePrepareDrawToSignSignatureType'
          description: Allow signing with "draw to sign".
        TypeToSign:
          $ref: '#/components/schemas/FilePrepareTypeToSignSignatureType'
          description: Allow signing with "type to sign".
        LocalCertificate:
          $ref: '#/components/schemas/FilePrepareLocalCertificateSignatureType'
          description: Allow signing with a local certificate.
        DisposableCertificate:
          $ref: '#/components/schemas/FilePrepareDisposableCertificateSignatureType'
          description: Allow signing with a disposable certificate.
        SwissComOnDemand:
          $ref: '#/components/schemas/FilePrepareSwissComOnDemandSignatureType'
          description: Allow signing with a Swisscom On-Demand certificate.
        ATrustCertificate:
          $ref: '#/components/schemas/FilePrepareATrustCertificateSignatureType'
          description: Allow signing with an A-Trust certificate.
        Biometric:
          $ref: '#/components/schemas/FilePrepareBiometricSignatureType'
          description: Allow signing with a biometric signature.
        RemoteCertificate:
          $ref: '#/components/schemas/FilePrepareRemoteCertificateSignatureType'
          description: Allow signing with a remote certificate.
        OneTimePassword:
          $ref: '#/components/schemas/FilePrepareOneTimePasswordSignatureType'
          description: Allow signing with a one time password (SMS-OTP).
        SwedishBankId:
          $ref: '#/components/schemas/FilePrepareSwedishBankIdSignatureType'
          description: Allow signing with Swedish BankID.
        SignaturePlugins:
          description: Allow signing with signature plugins.
          type: array
          items:
            $ref: '#/components/schemas/FilePrepareSignaturePluginSignatureType'
    FilePrepareComboBoxDefinition:
      description: The configuration of the combo box.
      type: object
      properties:
        TextFormat:
          $ref: '#/components/schemas/FilePrepareTextFormat'
          description: The configuration of the text format.
        Items:
          description: A list of items that can be selected for the element.
          type: array
          items:
            $ref: '#/components/schemas/FilePrepareChoiceItem'
        IsEditable:
          description: If true, the combo box is editable.
          type: boolean
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
        Position:
          $ref: '#/components/schemas/FilePreparePosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/FilePrepareSize'
          description: The size of the form field.
    FilePrepareTextFormat:
      description: The configuration of the text format.
      type: object
      properties:
        TextColor:
          description: 'The color of the text.

            Six digit hexadecimal color starting with # in #RRGGBB format according to CSS Color Module Level 4, paragraph 5.2.'
          type: string
        FontSizeInPt:
          format: double
          description: The size of the font in points.
          type: number
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        Bold:
          description: If true, the bold font is used.
          type: boolean
        Italic:
          description: If true, the italic font is used.
          type: boolean
        TextAlign:
          description: The alignment of the text. The default alignment is left.
          enum:
          - Left
          - Center
          - Right
          type: string
          x-ms-enum:
            name: TextAlignment
            modelAsString: false
    FilePrepareNumberValidationConfiguration:
      description: The validation rules for numbers.
      type: object
      properties:
        DecimalDigits:
          format: int32
          description: The expected amount of decimal digits.
          type: integer
        Symbol:
          description: The expected symbol.
          type: string
        SymbolLocation:
          description: The defined symbol location.
          enum:
          - Start
          - StartWithBlank
          - End
          - EndWithBlank
          type: string
          x-ms-enum:
            name: SymbolLocationType
            modelAsString: false
        GroupSeparator:
          description: The expected thousands separator.
          enum:
          - Comma
          - Point
          - Apostrophe
          - Blank
          - None
          type: string
        DecimalSeparator:
          description: The expected decimal separator.
          enum:
          - Comma
          - Point
          - Apostrophe
          - None
          type: string
          x-ms-enum:
            name: DecimalSeparatorType
            modelAsString: false
        Range:
          $ref: '#/components/schemas/FilePrepareFieldValidationRange'
          description: The range of the values.
    FilePrepareTextBoxDefinition:
      description: The configuration of the text box.
      type: object
      properties:
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
        MaxLength:
          format: int32
          description: The maximum length of the text.
          type: integer
        IsMultiline:
          description: If true, the text box can have multiple lines.
          type: boolean
        IsPassword:
          description: If true, the text box behaves like a password input field and does not show the actually entered characters.
          type: boolean
        TextFormat:
          $ref: '#/components/schemas/FilePrepareTextFormat'
          description: The configuration of the text format.
        Position:
          $ref: '#/components/schemas/FilePreparePosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/FilePrepareSize'
          description: The size of the form field.
    FilePrepareListBox:
      description: The configuration of the list box.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Required:
          description: If true, the element is required.
          type: boolean
        PreSelectedItems:
          description: The export values of the items which should be initially selected.
          type: array
          items:
            type: string
        GuidingOrder:
          format: int32
          description: The order of the element.
          type: integer
        Source:
          description: The element source from where a field originates.
          enum:
          - Document
          - AdvancedDocumentTag
          - UserDefined
          type: string
          x-ms-enum:
            name: FormFieldSource
            modelAsString: false
        FieldDefinition:
          $ref: '#/components/schemas/FilePrepareListBoxDefinition'
          description: The definition of the list box field.
    FilePrepareHyperLink:
      description: The definition of the hyperlink element.
      type: object
      properties:
        Id:
          description: The identifier of the hyperlink.
          type: string
        Uri:
          description: The URI of the hyperlink.
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Source:
          description: The element source from where a field originates.
          enum:
          - Document
          - AdvancedDocumentTag
          - UserDefined
          type: string
          x-ms-enum:
            name: FormFieldSource
            modelAsString: false
        FieldDefinition:
          $ref: '#/components/schemas/FilePrepareLinkDefinition'
          description: The definition of the hyperlink element.
    FilePrepareStampImprintDateConfiguration:
      description: The configuration of the stamp imprint date
      type: object
      properties:
        UseLocalTimezone:
          description: If true, the local timezone is used.
          type: boolean
        DateTimeFormat:
          description: The format of the timestamp.
          type: string
    FilePrepareSignaturePluginSignatureType:
      description: The configuration of the signature plugin.
      type: object
      properties:
        PluginId:
          description: The identifier of the plugin.
          type: string
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/FilePreparePluginStampImprint'
          description: The configuration of the stamp imprint of the signature.
    FilePrepareBiometricSignatureType:
      description: The configuration of the Biometric signature.
      type: object
      properties:
        BiometricVerification:
          description: If true, a biometric verification is performed.
          type: boolean
        AllowBiometricStoringOnly:
          description: If true, the biometric signature might be stored without verification.
          type: boolean
        StoreSignedResponseWithoutBioData:
          description: If true, the signed response is stored without biometric data.
          type: boolean
        BiometricServerUserId:
          description: The identifier of the user on the biometric server.
          type: string
        SignaturePositioning:
          description: The allowed positioning of the biometric signature.
          enum:
          - WithinField
          - OnPage
          - IntersectsWithField
          type: string
          x-ms-enum:
            name: BiometricSignaturePositioning
            modelAsString: false
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
    FilePrepareComboBox:
      description: The configuration of the combo box.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Required:
          description: If true, the element is required.
          type: boolean
        Value:
          description: The selected value of the combo box.
          type: string
        GuidingOrder:
          format: int32
          description: The order of the element.
          type: integer
        Source:
          description: The element source from where a field originates.
          enum:
          - Document
          - AdvancedDocumentTag
          - UserDefined
          type: string
          x-ms-enum:
            name: FormFieldSource
            modelAsString: false
        FieldDefinition:
          $ref: '#/components/schemas/FilePrepareComboBoxDefinition'
          description: The definition of the combo box.
    FilePrepareSwedishBankIdStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        FontSizeInPt:
          format: int32
          description: The size of the font in points.
          type: integer
        DisplayTransactionId:
          description: If true, the transaction identifier is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    FilePrepareSignatureTaskConfiguration:
      description: The configuration of the signature task.
      type: object
      properties:
        StampImprintDateConfiguration:
          $ref: '#/components/schemas/FilePrepareStampImprintDateConfiguration'
          description: The configuration of the stamp imprint date.
        BatchGroup:
          description: The batch group.
          type: string
    FilePrepareDisposableCertificateStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        FontSizeInPt:
          format: int32
          description: The size of the font in points.
          type: integer
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    FilePrepareListBoxDefinition:
      description: The configuration of the combo box.
      type: object
      properties:
        TextFormat:
          $ref: '#/components/schemas/FilePrepareTextFormat'
          description: The configuration of the text format.
        Items:
          description: A list of items that can be selected for the element.
          type: array
          items:
            $ref: '#/components/schemas/FilePrepareChoiceItem'
        IsMultiSelect:
          description: If true, multiple values of the list box can be selected.
          type: boolean
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
        Position:
          $ref: '#/components/schemas/FilePreparePosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/FilePrepareSize'
          description: The size of the form field.
    FilePrepareLinkDefinition:
      description: The settings of a positionable element.
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/FilePreparePosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/FilePrepareSize'
          description: The size of the form field.
    FilePreparePhoneValidationConfiguration:
      description: The validation rules for phone numbers.
      type: object
      properties:
        Type:
          description: The format of the phone numbers.
          enum:
          - International
          - InternationalLeadingZeros
          - InternationalLeadingPlus
          type: string
          x-ms-enum:
            name: PhoneType
            modelAsString: false
    FilePrepareRemoteCertificateSignatureType:
      description: The configuration of the RemoteCertificate signature.
      type: object
      properties:
        ValidityInSeconds:
          format: int32
          description: The validity of the certificate in seconds.
          type: integer
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/FilePrepareRemoteCertificateStampImprint'
          description: The configuration of the stamp imprint of the signature.
    FilePrepareTimeValidationConfiguration:
      description: The validation rules for time values.
      type: object
      properties:
        TimeFormat:
          description: The format of the time values.
          type: string
        Range:
          $ref: '#/components/schemas/FilePrepareFieldValidationRange'
          description: The range of the values.
    FilePrepareClickToSignStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        FontSizeInPt:
          format: int32
          description: The size of the font in points.
