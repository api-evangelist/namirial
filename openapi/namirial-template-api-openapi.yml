openapi: 3.2.0
info:
  title: Namirial Template API
  version: v6
  description: 'Operations tagged Template across 2 of this provider''s published API definitions: namirial-esignanywhere-v6-swagger.json, namirial-esignanywhere-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
- url: https://saas.esignanywhere.net/api
tags:
- name: Template
paths:
  /v6/template/{templateId}:
    get:
      tags:
      - Template
      summary: Get an overview of a template
      operationId: Template_GetTemplateById
      parameters:
      - name: templateId
        in: path
        description: The identifier of the template.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateGetResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TemplateGetResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/template/{templateId}/files:
    get:
      tags:
      - Template
      summary: Get the documents of a template
      operationId: Template_GetFiles
      parameters:
      - name: templateId
        in: path
        description: The identifier of the template.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateGetFilesResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TemplateGetFilesResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/template/{templateId}/elements:
    get:
      tags:
      - Template
      summary: Get the elements belonging to the documents of a template
      operationId: Template_GetElements
      parameters:
      - name: templateId
        in: path
        description: The identifier of the template.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateGetElementsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TemplateGetElementsResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/template/{templateId}/configuration:
    get:
      tags:
      - Template
      summary: Get the configuration of a template and its activities
      operationId: Template_GetConfiguration
      parameters:
      - name: templateId
        in: path
        description: The identifier of the template.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateGetConfigurationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TemplateGetConfigurationResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
  /v6/template/find:
    post:
      tags:
      - Template
      summary: Get basic information about templates which match your filter criteria
      operationId: Template_Find
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateFindResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TemplateFindResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateFindRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/TemplateFindRequest'
        description: The filter criteria.
        required: true
    servers:
    - url: /api
  /v6/template/createdraft:
    post:
      tags:
      - Template
      summary: Create a new draft from a template
      operationId: Template_CreateDraft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCreateDraftResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TemplateCreateDraftResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateDraftRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateDraftRequest'
        description: The model containing the create options.
        required: true
    servers:
    - url: /api
components:
  schemas:
    TemplateGetElementsClickToSignSignatureType:
      description: The configuration of the signature image.
      type: object
      properties:
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/TemplateGetElementsClickToSignStampImprint'
          description: The configuration of the stamp imprint of the signature.
    TemplateGetElementsSign:
      description: The elements, which are assigned to actions.
      type: object
      properties:
        SequenceMode:
          description: The sequence mode.
          enum:
          - NoSequenceEnforced
          - SequenceEnforced
          type: string
          x-ms-enum:
            name: ElementSequenceMode
            modelAsString: false
        Elements:
          $ref: '#/components/schemas/TemplateGetElementsElements'
          description: The definition of the assigned elements.
    TemplateGetElementsTypeToSignStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        FontSizeInPt:
          format: int32
          description: The size of the font in points.
          type: integer
        DisplayEmail:
          description: If true, the email address of the signer is displayed.
          type: boolean
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    TemplateGetElementsAttachmentDefinition:
      description: The settings of a positionable element.
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/TemplateGetElementsPosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/TemplateGetElementsSize'
          description: The size of the form field.
    TemplateGetElementsDisposableCertificateSignatureType:
      description: The configuration of the DisposableCertificate signature.
      type: object
      properties:
        IsLongLived:
          description: If true, the disposable certificate is long lived.
          type: boolean
        ValidityInSeconds:
          format: int32
          description: The validity of the certificate in seconds.
          type: integer
        UseExternalSignatureImage:
          description: The external signature image mode.
          enum:
          - Optional
          - Required
          - Disabled
          type: string
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/TemplateGetElementsDisposableCertificateStampImprint'
          description: The configuration of the stamp imprint of the signature.
    TemplateGetConfigurationView:
      description: The configuration of the action to view and acknowledge the documents.
      type: object
      properties:
        RecipientConfiguration:
          $ref: '#/components/schemas/TemplateGetConfigurationRecipientConfiguration'
          description: The configuration of the recipient.
        ViewingGroup:
          format: int32
          description: The parallel group for view actions.
          type: integer
        GeneralPoliciesOverrides:
          $ref: '#/components/schemas/TemplateGetConfigurationGeneralPoliciesForViewAction'
          description: Viewer policy settings for override.
    TemplateGetConfigurationDefaultSignatureTypeConfiguration:
      description: The configuration of the default signature type for a draft.
      type: object
      properties:
        None:
          $ref: '#/components/schemas/TemplateGetConfigurationDefaultSignature'
          description: '"None" SignatureType.'
        ClickToSign:
          $ref: '#/components/schemas/TemplateGetConfigurationDefaultSignature'
          description: '"click to sign" SignatureType.'
        DrawToSign:
          $ref: '#/components/schemas/TemplateGetConfigurationDefaultSignature'
          description: '"draw to sign" SignatureType.'
        TypeToSign:
          $ref: '#/components/schemas/TemplateGetConfigurationDefaultSignature'
          description: '"type to sign" SignatureType.'
        LocalCertificate:
          $ref: '#/components/schemas/TemplateGetConfigurationDefaultSignature'
          description: '"local certificate" SignatureType.'
        DisposableCertificate:
          $ref: '#/components/schemas/TemplateGetConfigurationDefaultSignature'
          description: '"disposable certificate" SignatureType.'
        Biometric:
          $ref: '#/components/schemas/TemplateGetConfigurationDefaultSignature'
          description: '"biometric signature" SignatureType.'
        RemoteCertificate:
          $ref: '#/components/schemas/TemplateGetConfigurationDefaultSignature'
          description: '"remote certificate" SignatureType.'
        OneTimePassword:
          $ref: '#/components/schemas/TemplateGetConfigurationDefaultSignature'
          description: '"one time password (SMS-OTP)" SignatureType.'
    TemplateGetConfigurationAdvancedRecipientConfiguration:
      description: The advanced configuration for the recipient.
      type: object
      properties:
        PersonalMessage:
          description: The personal message for the recipient.
          type: string
        NotificationChannel:
          description: Which channel is used for sending notifications to the recipient.
          enum:
          - None
          - Email
          - Sms
          - WhatsApp
          type: string
          x-ms-enum:
            name: RecipientNotificationChannel
            modelAsString: false
        AuthenticationConfiguration:
          $ref: '#/components/schemas/TemplateGetConfigurationAuthenticationConfiguration'
          description: The configuration for the authentication of the recipient.
        SendEmails:
          description: 'Obsolete: If true, emails will be sent out for this recipient.

            If NotificationChannel has value None, this will be false, otherwise true.'
          type: boolean
        AllowAccessAfterFinish:
          description: If true, the recipient is allowed to access the action after it has been finished.
          type: boolean
        IncludedEmailAppLinks:
          $ref: '#/components/schemas/TemplateGetConfigurationEmailAppLinks'
          description: The configuration for mobile app links in email messages.
        AllowDelegation:
          description: If true, the recipient may delegate this activity.
          type: boolean
        RequireViewContentBeforeFormFilling:
          description: If true, the signer has to confirm the reading of all documents as first task.
          type: boolean
    TemplateGetConfigurationWebFinishAction:
      description: Define actions for different clients that will trigger after an action has been finished.
      type: object
      properties:
        RedirectUri:
          description: The redirect uri.
          type: string
    TemplateGetElementsBiometricSignatureType:
      description: The configuration of the Biometric signature.
      type: object
      properties:
        BiometricVerification:
          description: If true, a biometric verification is performed.
          type: boolean
        AllowBiometricStoringOnly:
          description: If true, the biometric signature might be stored without verification.
          type: boolean
        StoreSignedResponseWithoutBioData:
          description: If true, the signed response is stored without biometric data.
          type: boolean
        BiometricServerUserId:
          description: The identifier of the user on the biometric server.
          type: string
        SignaturePositioning:
          description: The allowed positioning of the biometric signature.
          enum:
          - WithinField
          - OnPage
          - IntersectsWithField
          type: string
          x-ms-enum:
            name: BiometricSignaturePositioning
            modelAsString: false
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
    TemplateGetElementsDisposableCertificateStampImprint:
      description: The configuration of the stamp imprint used by multiple signature types.
      type: object
      properties:
        DisplayExtraInformation:
          description: If true, the extra information is displayed.
          type: boolean
        FontName:
          description: "The name of the font. The font needs to be installed on the server. \nIf it is not available on the server, a fallback font is used."
          type: string
        FontSizeInPt:
          format: int32
          description: The size of the font in points.
          type: integer
        DisplayIp:
          description: If true, the IP address of the signer is displayed.
          type: boolean
        DisplayName:
          description: If true, the name of the signer is displayed.
          type: boolean
        DisplaySignatureDate:
          description: If true, the timestamp of signing is displayed.
          type: boolean
    TemplateGetElementsPredefinedElementDefinition:
      description: The configuration of the predefined element.
      type: object
      properties:
        TextFormat:
          $ref: '#/components/schemas/TemplateGetElementsTextFormat'
          description: The configuration of the text format.
        Position:
          $ref: '#/components/schemas/TemplateGetElementsPosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/TemplateGetElementsSize'
          description: The size of the form field.
    TemplateGetElementsListBoxDefinition:
      description: The configuration of the list box.
      type: object
      properties:
        TextFormat:
          $ref: '#/components/schemas/TemplateGetElementsTextFormat'
          description: The configuration of the text format.
        Items:
          description: A list of items that can be selected for the element.
          type: array
          items:
            $ref: '#/components/schemas/TemplateGetElementsChoiceItem'
        IsMultiSelect:
          description: If true, multiple values of the list box can be selected.
          type: boolean
        ReadOnly:
          description: If true, the element is readonly.
          type: boolean
        Position:
          $ref: '#/components/schemas/TemplateGetElementsPosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/TemplateGetElementsSize'
          description: The size of the form field.
    TemplateGetElementsChoiceItem:
      description: The configuration of the choice item.
      type: object
      properties:
        ExportValue:
          description: The value of the element when the choice item is selected.
          type: string
        DisplayValue:
          description: The displayed value of the choice item.
          type: string
    TemplateGetConfigurationAppFinishAction:
      description: Define actions for different clients that will trigger after an action has been finished.
      type: object
      properties:
        RemoveDocumentFromRecentDocumentList:
          description: If true, the document will be removed from the recent document list.
          type: boolean
        CallClientActionOnlyAfterSuccessfulSync:
          description: If true, the client action will be called only after a successful sync.
          type: boolean
        CloseApp:
          description: If true, the app will be closed.
          type: boolean
        RedirectUri:
          description: The redirect uri.
          type: string
    TemplateGetElementsPredefinedFieldElements:
      description: Defines the predefined fields which will be added and filled by the system.
      type: object
      properties:
        TextFields:
          description: The predefined text fields.
          type: array
          items:
            $ref: '#/components/schemas/TemplateGetElementsPredefinedText'
        EmailFields:
          description: The recipient's email fields.
          type: array
          items:
            $ref: '#/components/schemas/TemplateGetElementsEmail'
        InitialsFields:
          description: The recipient's initials fields.
          type: array
          items:
            $ref: '#/components/schemas/TemplateGetElementsInitials'
        GivenNameFields:
          description: The recipient's given name fields.
          type: array
          items:
            $ref: '#/components/schemas/TemplateGetElementsGivenName'
        SurnameFields:
          description: The recipient's surname fields.
          type: array
          items:
            $ref: '#/components/schemas/TemplateGetElementsSurname'
        FullNameFields:
          description: The recipient's full name fields.
          type: array
          items:
            $ref: '#/components/schemas/TemplateGetElementsFullName'
        DateFields:
          description: The current date fields.
          type: array
          items:
            $ref: '#/components/schemas/TemplateGetElementsDate'
    TemplateGetConfigurationActionCallbackSelection:
      description: The selection of events which trigger the callback.
      type: object
      properties:
        ConfirmTransactionCode:
          description: If true, the callback is triggered when a transaction code was sent. This is only used for legacy disposable certificates, after user accepted issuance of disposable certificate.
          type: boolean
        AgreementAccepted:
          description: If true, the callback is triggered when the user accepted the agreement.
          type: boolean
        AgreementRejected:
          description: If true, the callback is triggered when the user rejected the agreement.
          type: boolean
        PrepareAuthenticationSuccess:
          description: If true, the callback is triggered when the preparation of the authentication process succeeded.
          type: boolean
        AuthenticationFailed:
          description: If true, the callback is triggered when the user failed to authenticate.
          type: boolean
        AuthenticationSuccess:
          description: If true, the callback is triggered when the user succeeded to authenticate.
          type: boolean
        AuditTrailRequested:
          description: If true, the callback is triggered when the audit trail was requested.
          type: boolean
        AuditTrailXmlRequested:
          description: If true, the callback is triggered when the audit trail XML was requested.
          type: boolean
        CalledPage:
          description: If true, the callback is triggered when the SignAnyWhere Viewer was requested.
          type: boolean
        DocumentDownloaded:
          description: If true, the callback is triggered when the document download was requested.
          type: boolean
        FlattenedDocumentDownloaded:
          description: If true, the callback is triggered when the flattened document download was requested.
          type: boolean
        AddedAnnotation:
          description: If true, the callback is triggered when an annotation was added.
          type: boolean
        AddedAttachment:
          description: If true, the callback is triggered when an attachment was added.
          type: boolean
        AppendedDocument:
          description: If true, the callback is triggered when a document was appended.
          type: boolean
        FormsFilled:
          description: If true, the callback is triggered when a form field was filled.
          type: boolean
        ConfirmReading:
          description: If true, the callback is triggered when a reading task was completed.
          type: boolean
        SendTransactionCode:
          description: If true, the callback is triggered when a transaction code for a signature with type TransactionCode was sent using the TransactionCodeSenderPlugin.
          type: boolean
        PrepareSignWorkstepDocument:
          description: If true, the callback is triggered when a signature was prepared for signing.
          type: boolean
        SignWorkstepDocument:
          description: If true, the callback is triggered when a signature was applied.
          type: boolean
        UndoAction:
          description: If true, the callback is triggered when an action was undone.
          type: boolean
        WorkstepCreated:
          description: If true, the callback is triggered when a workstep was created.
          type: boolean
        WorkstepFinished:
          description: If true, the callback is triggered when a workstep was finished.
          type: boolean
        WorkstepRejected:
          description: If true, the callback is triggered when a workstep was rejected.
          type: boolean
        DisablePolicyAndValidityChecks:
          description: If true, the callback is triggered when policy and validity checks were disabled.
          type: boolean
        EnablePolicyAndValidityChecks:
          description: If true, the callback is triggered when policy and validity checks were enabled.
          type: boolean
        AppendFileToWorkstep:
          description: If true, the callback is triggered when a file was appended to the workstep.
          type: boolean
        AppendTasksToWorkstep:
          description: If true, the callback is triggered when a task was added to the workstep.
          type: boolean
        SetOptionalDocumentState:
          description: If true, the callback is triggered when an optional document became either active or inactive.
          type: boolean
        PreparePayloadForBatch:
          description: If true, the callback is triggered when the payload was prepared for batch signing.
          type: boolean
    TemplateGetElementsSignatureFieldDefinition:
      description: The settings of a positionable element.
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/TemplateGetElementsPosition'
          description: The position of the  within the document.
        Size:
          $ref: '#/components/schemas/TemplateGetElementsSize'
          description: The size of the form field.
    TemplateGetElementsInitials:
      description: The configuration of the predefined element showing the initials.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          type: string
        IncludeMiddleNameInitials:
          description: "If true, the initials from the middle names are included as well. \nThe initials are read from the given name. Additional names are expected to be separated by a space."
          type: boolean
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Source:
          description: The element source from where a field originates.
          enum:
          - Document
          - AdvancedDocumentTag
          - UserDefined
          type: string
          x-ms-enum:
            name: FormFieldSource
            modelAsString: false
        FieldDefinition:
          $ref: '#/components/schemas/TemplateGetElementsPredefinedElementDefinition'
          description: The definition of the predefined element.
    TemplateGetElementsResponse:
      description: The response model for requesting document elements of a draft or template.
      type: object
      properties:
        UnassignedElements:
          $ref: '#/components/schemas/TemplateGetElementsElements'
          description: The elements which are not assigned to any action.
        Activities:
          description: The steps for the envelope.
          type: array
          items:
            $ref: '#/components/schemas/TemplateGetElementsActivity'
    TemplateGetElementsSignaturePluginSignatureType:
      description: The configuration of the signature plugin.
      type: object
      properties:
        PluginId:
          description: The identifier of the plugin.
          type: string
        Preferred:
          description: If true, the signature type is set as preferred.
          type: boolean
        StampImprintConfiguration:
          $ref: '#/components/schemas/TemplateGetElementsPluginStampImprint'
          description: The configuration of the stamp imprint of the signature.
    TemplateGetConfigurationExpirationConfiguration:
      description: The configuration of the expiration for the envelope.
      type: object
      properties:
        ExpirationInSeconds:
          format: int64
          description: The relative expiration in seconds after sending the envelope.
          type: integer
        ExpirationDate:
          format: date-time
          description: 'The absolute expiration date of the envelope.

            A datetime in the format RFC 3339, section 5.6, ''date-Time'' (e.g. 2017-07-21T17:32:28Z).'
          type: string
    TemplateGetConfigurationAccessCodeAuthentication:
      description: The configuration for authentication with a predefined access code.
      type: object
      properties:
        Code:
          description: The code for authenticating the recipient.
          type: string
    TemplateGetElementsCheckBox:
      description: The configuration of the check box.
      type: object
      properties:
        ElementId:
          description: The identifier of the element.
          type: string
        DocumentNumber:
          format: int32
          description: The reference number of the containing document. It starts with 1.
          type: integer
        Required:
          description: If true, the element is required.
          type: boolean
        IsChecked:
          description: If true, the check box is checked.
          type: boolean
        GuidingOrder:
          format: int32
          description: The order of the element.
          type: integer
        Source:
          description: The element source from where a field originates.
          enum:
          - Document
          - AdvancedDocumentTag
          - UserDefined
          type: string
          x-ms-enum:
            name: FormFieldSource
            modelAsString: false
        FieldDefinition:
