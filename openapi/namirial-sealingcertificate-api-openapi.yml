openapi: 3.2.0
info:
  title: Namirial Sealing Certificate API
  version: v6
  description: 'Operations tagged SealingCertificate across 2 of this provider''s published API definitions: namirial-esignanywhere-v6-swagger.json, namirial-esignanywhere-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
- url: https://saas.esignanywhere.net/api
tags:
- name: SealingCertificate
paths:
  /v6/organization/sealingcertificates:
    get:
      tags:
      - SealingCertificate
      summary: Get the available sealing certificates
      operationId: SealingCertificate_GetAll
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SealingCertificateGetAllResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/SealingCertificateGetAllResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiToken: []
    servers:
    - url: /api
components:
  schemas:
    SealingCertificateGetAllEntry:
      description: Sealing certificate information.
      type: object
      properties:
        Id:
          description: Identifier used to reference the certificate for an envelope.
          type: string
        CommonName:
          description: Common name of the certificate.
          type: string
        ExpirationDate:
          format: date-time
          description: Expiration date of the certificate.
          type: string
        Thumbprint:
          description: Thumbprint of the certificate.
          type: string
        IsDefault:
          description: Is the certificate the default for all envelopes.
          type: boolean
    ErrorResponse:
      description: Error object that is returned when the api call was not processed successfully.
      type: object
      properties:
        ErrorId:
          description: Id of the error.
          type: string
        Message:
          description: Message from the error.
          type: string
        TraceId:
          description: Trace identifier.
          type: string
    SealingCertificateGetAllResponse:
      description: Information about all available sealing configurations.
      type: object
      properties:
        SealingCertificates:
          description: Sealing certificates.
          type: array
          items:
            $ref: '#/components/schemas/SealingCertificateGetAllEntry'
  securitySchemes:
    apiToken:
      type: apiKey
      description: API Key Authentication
      name: apiToken
      in: header
x-refined-from:
- namirial-esignanywhere-v6-swagger.json
- namirial-esignanywhere-openapi.yml
